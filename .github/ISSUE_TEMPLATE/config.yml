blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability (private)
    url: https://github.com/Raymalian/innsegl/security/advisories/new
    about: >-
      Never report a suspected vulnerability in a public issue. Use GitHub
      Security Advisories - see SECURITY.md for what counts as a vulnerability
      here and what we commit to in return.
  - name: Contributing guide
    url: https://github.com/Raymalian/innsegl/blob/HEAD/CONTRIBUTING.md
    about: >-
      Read this before opening a pull request. The TDD gate and the
      protected-surfaces rule are merge gates, not preferences.
