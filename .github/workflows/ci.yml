# Innsegl CI — the gate every merge has to clear.
#
# IP §2: "CI gates on: full test suite green, coverage floors, lint, and the
# verification checks in Section 8." Nothing here is advisory; every job that
# fails blocks the merge.
#
# All third-party actions are pinned to a commit SHA with the human-readable
# tag in a trailing comment. Floating refs (@main, @v1) are forbidden: a
# supply-chain attack on an action is an attack on the attestation chain this
# project exists to protect (doc 04).
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main: its result is the branch's recorded state.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fail loudly on a toolchain mismatch instead of silently downloading a
  # different Go than the one go.mod declares.
  GOTOOLCHAIN: local

jobs:
  build:
    name: build and vet
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...

  test:
    name: test (race)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The suite includes test/e2e's I6 author gate (GH-002), which walks
          # every non-merge commit reachable from HEAD. At the default depth of
          # 1 it would see one commit — on a pull_request event, GitHub's
          # synthetic refs/pull/N/merge — so it REFUSES a shallow clone rather
          # than report a clean history it never read. The full history is 25
          # commits; there is nothing to save here.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Require Docker
        # The integration tests need real Postgres, MinIO and Rekor — doc 01 §2:
        # a mocked dependency proves nothing. Without a daemon those tests skip
        # silently and coverage collapses. Declare the dependency instead of
        # inheriting it from whatever the runner image happens to ship.
        run: |
          docker info >/dev/null 2>&1 || {
            echo "::error::Docker is required: the integration tests run against real"
            echo "::error::Postgres, MinIO and Rekor containers. Without it they skip"
            echo "::error::silently and internal/ledger falls from 92.9% to 48.7%."
            exit 1
          }
          docker version --format '  docker {{.Server.Version}}'
      - name: Install gitsign
        # The signing and verification harnesses exec `gitsign` from PATH, and
        # it is deliberately not a go.mod dependency (ADR-0031: importing it
        # drags cosign and sigstore-go into a 14-entry module for a binary we
        # exec). Without it every test that needs a real signature SKIPS — and
        # a Go skip exits zero, so CI stayed green while SIG-001, VER-001 and
        # the whole Sigstore suite never ran. scripts/test-no-skips.sh is what
        # surfaced that; this is the missing dependency it found.
        #
        # Pinned to the version the harnesses assert (harnessGitsignVersion).
        run: |
          go install github.com/sigstore/gitsign@v0.17.1
          gitsign --version
      - name: go test -race
        # Default parallelism, deliberately: every package that drives a
        # compose stack now namespaces its project per test process
        # (RM-065, #81), so concurrent packages are the thing under test
        # rather than a hazard the runner has to be slowed down to avoid.
        run: ./scripts/test-no-skips.sh
      # A Go skip exits zero, and `go test` without -v prints no SKIP line for a
      # subtest — so a skipped VER-001 is invisible in this log. Docker is
      # required above, which makes any unexplained skip here a missing
      # dependency rather than a pass. scripts/test-no-skips.sh reads the JSON
      # stream and refuses one, with a short justified allowlist for the skips
      # that are correct by construction.

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned to the version the repository is developed against.
          version: v2.13.2
          # Verify .golangci.yml against the JSON schema before linting, so a
          # malformed config is a failure and not a silently reduced ruleset.
          verify: true
          # Every finding fails the build, including pre-existing ones.
          only-new-issues: false

  spdx:
    name: spdx headers
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify every tracked source file carries the SPDX header
        run: ./scripts/spdx-check.sh

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # `npm ci` and not `npm install`: it installs the lockfile exactly and
      # fails if package.json and the lockfile disagree, which is the whole
      # point of committing a lockfile for a dashboard that renders
      # attestation verdicts. ADR-0001 puts the dashboard in TypeScript;
      # ADR-0038 chose its foundation.
      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Types
        working-directory: web
        run: npx tsc --noEmit
      # The suite carries the copy discipline (no user-visible string literal
      # in any component, across both source trees), the colour discipline
      # (no hue word, no Tailwind default colour utility, no dark: variant),
      # and the identifier truncation rules. None of it needs a browser.
      - name: Test
        working-directory: web
        run: npx vitest run
      - name: Build
        working-directory: web
        run: npm run build

  accessibility:
    name: accessibility and visual regression
    runs-on: ubuntu-latest
    # RM-049 (#57) / doc 06 §6.4 "(gating, not aspirational)" and doc 06 §7
    # ("automated axe pass + keyboard-path tests in CI"). The `dashboard` job
    # above runs the jsdom suite, which resolves neither `light-dark()` nor
    # inheritance and computes no accessible name — the two blind spots that
    # let issue #104 ship a 1.07:1 evidence link. This job is the real browser.
    #
    # It runs INSIDE the official Playwright image rather than on the bare
    # runner with `playwright install --with-deps`, for one reason: twelve
    # committed screenshot baselines. Chromium's text rasterization depends on
    # the fontconfig/freetype/font set of the machine that drew it, so a
    # baseline is only meaningful against a fixed image. The runner's package
    # set is not fixed; this image's digest is.
    #
    # Pinned by digest for the same reason the actions above are: the header of
    # this file forbids floating refs, and a container image tag is mutable in
    # exactly the way a tag on an action is. sha256:dcc5531e… is the multi-arch
    # index; on this amd64 runner it resolves to sha256:c091b21d…, which is the
    # manifest the committed `-chromium-linux.png` baselines were generated
    # against.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      # Chromium's default /dev/shm inside a container is 64 MB, which it
      # exhausts and then crashes in ways that look like flaky tests.
      options: --ipc=host
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No setup-node: the image ships the Node the browsers were built
      # against, and installing a different one is how a browser/driver
      # mismatch gets introduced.
      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Browsers match the image
        # The image supplies the browser binaries (PLAYWRIGHT_BROWSERS_PATH);
        # package.json supplies the driver. If someone bumps @playwright/test
        # without bumping the image digest above, Playwright would silently
        # look for a browser build this image does not contain — or, worse,
        # download a different one and invalidate every committed baseline.
        # Fail on the mismatch instead.
        working-directory: web
        run: |
          driver="$(npx playwright --version | awk '{print $2}')"
          image="${PW_IMAGE_VERSION:-1.62.1}"
          echo "playwright driver: $driver / image: $image"
          if [ "$driver" != "$image" ]; then
            echo "::error::Playwright driver $driver does not match the container image $image."
            echo "::error::Bump BOTH web/package.json and this job's image digest together,"
            echo "::error::then regenerate the -chromium-linux.png baselines."
            exit 1
          fi
          test -d "${PLAYWRIGHT_BROWSERS_PATH:-/ms-playwright}"
        env:
          # Kept beside the digest above so the two are edited together.
          PW_IMAGE_VERSION: "1.62.1"
      - name: axe, keyboard, contrast, green audit and visual regression
        # Every `expect` in web/tests fails this job. doc 06 §6.4 is gating:
        # a harness that reports and does not fail is what #57 replaced.
        working-directory: web
        run: npx playwright test -c tests/playwright.config.ts
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          # Traces, the actual/expected/diff PNGs of a failed snapshot, and the
          # HTML report. A visual regression is unreadable without them.
          path: |
            web/tests/playwright-report
            web/tests/test-results
          if-no-files-found: warn
          retention-days: 14

  tokens:
    name: token sheet
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # FD 5.3 reserves green for cryptographic verification alone, and FD 8
      # makes a violation a defect found in review. Review is the wrong place
      # for a rule a machine can check: ADR-0038 chose headless primitives over
      # Carbon precisely because Carbon ships a green named supportSuccess and
      # spends it on toggles and progress bars, and the argument for that
      # choice is worthless if our own sheet can drift the same way unnoticed.
      #
      # The gate also holds the contrast floor. Neither needs Go, Docker or
      # Node — it is shell and awk over one CSS file.
      - name: Token semantics and contrast floor
        run: ./web/src/tokens/check-tokens.sh
      # The gate is itself code, so it is tested: ten mutations of the shipped
      # sheet that it must refuse, plus the shipped sheet, which it must
      # accept. A gate that passes everything is the failure mode here.
      - name: Token gate self-test
        run: ./web/src/tokens/check-tokens-selftest.sh

  coverage:
    name: coverage floors
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The suite includes test/e2e's I6 author gate (GH-002), which walks
          # every non-merge commit reachable from HEAD. At the default depth of
          # 1 it would see one commit — on a pull_request event, GitHub's
          # synthetic refs/pull/N/merge — so it REFUSES a shallow clone rather
          # than report a clean history it never read. The full history is 25
          # commits; there is nothing to save here.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Require Docker
        # The integration tests need real Postgres, MinIO and Rekor — doc 01 §2:
        # a mocked dependency proves nothing. Without a daemon those tests skip
        # silently and coverage collapses. Declare the dependency instead of
        # inheriting it from whatever the runner image happens to ship.
        run: |
          docker info >/dev/null 2>&1 || {
            echo "::error::Docker is required: the integration tests run against real"
            echo "::error::Postgres, MinIO and Rekor containers. Without it they skip"
            echo "::error::silently and internal/ledger falls from 92.9% to 48.7%."
            exit 1
          }
          docker version --format '  docker {{.Server.Version}}'
      - name: Install gitsign
        # The signing and verification harnesses exec `gitsign` from PATH, and
        # it is deliberately not a go.mod dependency (ADR-0031: importing it
        # drags cosign and sigstore-go into a 14-entry module for a binary we
        # exec). Without it every test that needs a real signature SKIPS — and
        # a Go skip exits zero, so CI stayed green while SIG-001, VER-001 and
        # the whole Sigstore suite never ran. scripts/test-no-skips.sh is what
        # surfaced that; this is the missing dependency it found.
        #
        # Pinned to the version the harnesses assert (harnessGitsignVersion).
        run: |
          go install github.com/sigstore/gitsign@v0.17.1
          gitsign --version
      - name: Produce coverage profile
        # -coverpkg=./... instruments every package in the module, so a package
        # with no test file at all reports 0% instead of vanishing from the
        # profile and being counted as compliant by omission.
        #
        # Serialised packages were a stopgap here too, and never a fix: they
        # order packages within ONE invocation, while the collision was
        # between this job and any other `go test` process. See RM-065 (#81).
        run: >-
          go test ./... -race
          -covermode=atomic
          -coverpkg=./...
          -coverprofile=cover.out
      - name: Enforce coverage floors
        # Hard gate. IP §2: 90% line coverage on the MCP server and ledger
        # packages. The script exits non-zero when a floor is breached; it does
        # not merely report.
        #
        # WHAT THIS STEP DOES AND DOES NOT MEASURE. Go's tooling measures
        # *statement* coverage, and there is no branch mode in `go tool cover`,
        # so the 90% floor here stands in for IP §2's "line coverage"
        # requirement and nothing more. IP §2's separate 100% *branch* floor on
        # hash-chain append, segment sealing, signature verification and every
        # error-return path of every MCP tool is enforced by the "branch
        # coverage" job, which runs gobco — not by this step, and not implied
        # by the numbers it prints (RM-064, #72).
        #
        # COVERAGE_REQUIRE_PACKAGES=1 so a floored package that disappears
        # fails instead of silently skipping. A floor over a package that is no
        # longer there is a gate reporting on nothing, which is the false green
        # this repository keeps finding (#101, RM-035).
        env:
          COVERAGE_REQUIRE_PACKAGES: "1"
        run: ./scripts/coverage-floors.sh cover.out
      - name: Human-readable coverage report
        if: always()
        run: go tool cover -func=cover.out || true
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-profile
          path: cover.out
          if-no-files-found: warn
          retention-days: 14

  coverage-gate-selftest:
    name: coverage gate self-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Deliberately not go-version-file: this job tests the gate itself
          # against a throwaway fixture module and must keep working
          # independently of the repository's own module.
          go-version: stable
          check-latest: true
      - name: Prove the gate fails on an uncovered branch
        # Issue #10 acceptance criterion: "A deliberately uncovered branch in a
        # floored package fails CI." This asserts red-then-green on the gate.
        run: ./scripts/coverage-floors-selftest.sh

  branch-coverage:
    name: branch coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install gobco
        # Go has no branch coverage mode: go tool cover counts statements, and a
        # function can reach 100% statements with an untaken `if` — exactly the
        # case IP §2's branch floor exists to catch.
        run: go install github.com/rillig/gobco@v1.3.4
      - name: Enforce 100% branch coverage on the IP §2 surfaces
        run: ./scripts/branch-coverage.sh

  init-e2e:
    name: init end-to-end signing
    # Its OWN job, and that is the point. INIT-008/INIT-009 stand up a real
    # SPIRE, Fulcio and Rekor — roughly eight Docker networks — so they are
    # opt-in via INNSEGL_RUN_INIT_E2E rather than running inside the default
    # matrix, where this machine's address-pool ceiling (#100) would collide
    # with the suites that already hold eight each.
    #
    # Opt-in must not mean never. A runner is not a developer's laptop: it
    # starts with an empty Docker and runs this package alone, so the budget
    # that justifies the gate locally does not apply here. A control that is
    # tested and never executed is absent from every deployment while looking
    # present in every survey — RM-096 (#153) is this project's own report of
    # exactly that, found the same week.
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install gitsign
        run: go install github.com/sigstore/gitsign@v0.17.1
      - name: Drive innsegl init against a real SPIRE, Fulcio and Rekor
        env:
          INNSEGL_RUN_INIT_E2E: "1"
          INNSEGL_TEST_FLAGS: "-p 1"
        run: go test ./cmd/innsegl/ -run 'TestINIT00[89]' -race -count=1 -v

  branch-coverage-gate-selftest:
    name: branch coverage gate self-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Deliberately not go-version-file: this job tests the gate itself
          # against a throwaway fixture module and must keep working
          # independently of the repository's own module.
          go-version: stable
          check-latest: true
      - name: Install gobco
        run: go install github.com/rillig/gobco@v1.3.4
      - name: Prove the gate fails on an uncovered branch
        # RM-064 (#72) acceptance criterion: "The self-test demonstrates
        # red-then-green for the branch floor, not only the line floor."
        # scripts/coverage-floors-selftest.sh already proves it for the
        # statement floor above; this is its sibling for the branch floor
        # ADR-0043 chose gobco to enforce.
        run: ./scripts/branch-coverage-selftest.sh
