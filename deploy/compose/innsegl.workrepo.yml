# SPDX-License-Identifier: Apache-2.0
#
# Sign in the repositories you actually work in — all of them, not one.
#
# WHAT THIS SOLVES. Without it, `sign_commit` resolves a repository beneath the
# MCP's own workspace volume, which starts empty. Signing one commit meant
# copying the repository in, staging there, calling the tool, then tarring
# `.git` back out and fetching the commit. Four of seven steps were moving
# files between two copies of one repository.
#
# HOW. One bind mount of the directory your projects live in, plus one symlink
# per project inside the workspace volume at the path the MCP already resolves
# that repository to — `internal/mcp.Workspace.Worktree` is
# `filepath.Join(root, repo)` with root `/work`. Nothing in the Go changes.
#
#   /work/github.com/<org>/<name>  ->  /projects/<directory>
#
# WHY SYMLINKS AND NOT A MOUNT PER REPOSITORY. A mount per repository needs the
# container recreated to add one. A symlink does not, so a project becomes
# signable while the stack is running.
#
# WHY NOT MOUNT THE PARENT AT /work/github.com/<org>. Measured against this
# machine, and it is why the obvious shortcut is not here: projects live under
# TWO orgs (`KodyMike` and `Raymalian`), and two directory names do not match
# their repositories, because a clone may be named anything. A parent mount
# assumes one org and matching names, and silently resolves the wrong thing
# when either is false.
#
# USE IT
#
#   make innsegl-up-here                       brings the stack up with this file
#   make innsegl-link DIR=~/Applications/<project>  make one project signable
#   make innsegl-link DIR=.                        the one you are standing in
#
# The link target is read from that repository's own `origin`, so a fork or a
# rename is followed rather than assumed.
#
# WHAT YOU ARE AGREEING TO, AND IT IS BIGGER THAN IT LOOKS
#
# The MCP gets WRITE access to everything under the projects root — not only
# the repositories you have linked. It cannot be read-only: creating a commit
# is a write.
#
# `sign_commit` writes into a linked worktree and does not move your HEAD, your
# branch or your index (asserted by INIT-008), so nothing it does is meant to
# touch your work. But the process CAN write there, and an operator should
# agree to that deliberately rather than inherit it. Point INNSEGL_PROJECTS at
# a narrower directory if that is too much.
#
# This is why the file is an override you opt into and not a default.

# EVERY SERVICE THAT MOUNTS THE WORKSPACE NEEDS THIS MOUNT TOO, and forgetting
# one is silent. A repository in the workspace is a SYMLINK into /projects, so
# a container with /work and without /projects sees a dangling link and reports
# the repository as absent.
#
# Measured 2026-09-08, after this file introduced the symlinks: innsegl-api had
# /work and not /projects, so the dashboard's "Verify this commit" answered
# 404 Not Found for a commit that was perfectly fine. The same mistake had
# already been made and fixed in the innsegl-verify-commit target an hour
# earlier, and was repeated here.
#
# `docker compose config` names the three: innsegl-mcp, innsegl-api and
# innsegl-reconciler. Check that list again if a service is added.

services:
  innsegl-mcp:
    environment:
      # WHAT THE MOUNT BELOW IS A MOUNT OF, which is the one thing a container
      # cannot work out for itself.
      #
      # `describe_workspace` (RM-126) is handed a harness's OWN working
      # directory -- a path on the host -- and has to answer about the same
      # tree in here. It knows where the mount IS; nothing in the container
      # says what it CORRESPONDS TO. So it is told, from the same variable the
      # mount is written from, and the two cannot drift apart.
      #
      # Unset, the tool refuses every call and says so by name. That is the
      # point: the plausible guesses all describe a repository confidently and
      # may describe the wrong one, and the answer is on its way into an
      # append-only record.
      INNSEGL_HOST_PROJECTS: ${INNSEGL_PROJECTS:?set it to the directory your git projects live in, e.g. $HOME/Applications}

      # WHERE `observe_tool_call` KEEPS THE BODIES, and it is the same
      # directory innsegl-api and innsegl-reconciler below read. One directory,
      # one writer, two readers -- the api serves them to the dashboard and the
      # reconciler judges writes against them, and both re-derive the path from
      # a digest in the chain, so this is a layout and not a preference.
      #
      # The LEDGER may never hold one: doc 02 §3 gives a `tool_call` no member
      # for a body and IP E4 makes that mechanical. A body carries file
      # contents and commands, which is the most sensitive data this system
      # touches, so it is written to the operator's own disk and sent nowhere.
      #
      # Unset, the tool is advertised, refuses every call by name, and says so
      # in the start-up log. It is not silent either way (#211).
      INNSEGL_MCP_LOG_DIR: /agentlog

      # WHERE `observe_session` KEEPS THE SESSION-TO-RUN MAPPING.
      #
      # A named volume and not a bind mount: nothing outside this process reads
      # it, which is the point of RM-128 (#207) -- the bookkeeping moved off
      # every harness and into the MCP, so a shim never has to know which files
      # exist or what is on which line of them.
      #
      # It OUTLIVES the stack deliberately. A mapping that was never written,
      # or was thrown away, is a run nothing will ever retire: measured before
      # this existed, three runs registered one afternoon were still Active
      # seventeen hours later. `docker compose down -v` removes it, and that is
      # the one command that should.
      INNSEGL_MCP_SESSION_DIR: /sessions
    volumes:
      # Read-write, and it has to be: a commit is a write. See above.
      - ${INNSEGL_PROJECTS:?set it to the directory your git projects live in, e.g. $HOME/Applications}:/projects
      # THE SAME DIRECTORY, MOUNTED AGAIN AT ITS HOST PATH, and this is the
      # only way a LINKED WORKTREE can be signed.
      #
      # A linked worktree's `.git` is a file holding an ABSOLUTE path to the
      # real git directory, written by whoever ran `git worktree add` -- on the
      # host. Measured 2026-09-08 with the worktree resolved correctly at
      # /projects/innsegl/.claude/worktrees/agent-probe:
      #
      #   fatal: not a git repository:
      #   <host-checkout>/.git/worktrees/agent-probe
      #
      # The path inside the file is the host's and means nothing in a container
      # that mounted the same directory somewhere else. Rewriting the file
      # would corrupt it for the host, and `git commit` offers no way to
      # override that pointer, so the fix is to make the host's path true in
      # here as well. Both mounts are the same directory; neither is a copy.
      #
      # This is what makes a subagent under worktree isolation signable at all
      # (MCP-029, ADR-0046).
      - ${INNSEGL_PROJECTS:?set it to the directory your git projects live in, e.g. $HOME/Applications}:${INNSEGL_PROJECTS}
      # READ-WRITE, and it is the ONLY read-write mount of this directory in
      # the stack. innsegl-api and innsegl-reconciler mount the same directory
      # read-only below, because retention belongs to whoever writes the
      # bodies and a read path that could delete would be one misconfiguration
      # away from pruning on another schedule. Since #211 the writer is this
      # service rather than a harness hook.
      - ${INNSEGL_LOG_DIR:-${HOME}/.innsegl/log}:/agentlog
      # The session markers. See INNSEGL_MCP_SESSION_DIR above.
      - innsegl-sessions:/sessions

  innsegl-api:
    environment:
      # The harness's tool-call bodies, which the LEDGER may never hold: doc 02
      # §3 gives a tool_call no member for its body and IP E4 makes that
      # mechanical, so a `tool_call` event says `"tool_name": "Edit"` and a
      # digest and nothing more.
      #
      # The bodies live on the operator's own disk with a 90-day life, and the
      # digest already in the chain is what proves one has not been altered.
      # Deleting them later costs nothing, because verification reads the
      # digest. Identity is unaffected and never expires -- it is in the chain.
      INNSEGL_API_LOG_DIR: /agentlog
      INNSEGL_API_LOG_DAYS: ${INNSEGL_LOG_DAYS:-90}
    volumes:
      # READ-ONLY, and it matters more here than for the workspace: retention
      # belongs to the hook that writes these. A read path that could delete
      # would be one misconfiguration away from pruning on another schedule.
      - ${INNSEGL_LOG_DIR:-${HOME}/.innsegl/log}:/agentlog:ro
      # READ-ONLY, matching how this service already mounts the workspace. doc
      # 05's proof BFF reads commit objects with git plumbing and must not be
      # able to write into the tree it verifies.
      - ${INNSEGL_PROJECTS:?set it to the directory your git projects live in, e.g. $HOME/Applications}:/projects:ro

  innsegl-reconciler:
    volumes:
      - ${INNSEGL_PROJECTS:?set it to the directory your git projects live in, e.g. $HOME/Applications}:/projects:ro
      # RM-104 (#169): the harness's retained tool-call bodies. READ-ONLY, and
      # read-only is load-bearing — this is the evidence the check judges, and
      # a process that could rewrite it could also make its own findings go
      # away. The reconciler opens only the files a run's own events name.
      - ${INNSEGL_LOG_DIR:-${HOME}/.innsegl/log}:/harness-log:ro

# An override file may declare volumes of its own, and this one does: the
# session markers exist only where the ingestion tools are configured, which is
# exactly where this file applies.
volumes:
  # observe_session's session-to-run mapping (RM-128, #207; wired by #211).
  # MOUNTED BY: innsegl-mcp (rw). Nothing else, ever -- no other component has
  # any business knowing which harness session a run came from.
  innsegl-sessions:
