# SPDX-License-Identifier: Apache-2.0
#
# ============================================================================
# Innsegl reference compose stack — the components this project IS (RM-076,
# #109). deploy/compose/spire.yml and deploy/compose/sigstore.yml are its
# dependencies; this file is Innsegl.
#
# Doc 05 §1 is the specification for this file. It names seven rows here:
#
#   postgres            upstream   Ledger hot tier
#                                  Single instance; volume-backed
#   object store        upstream   Object storage with object lock enabled
#                                  Buckets created with lock on; SEG-005 canary
#                                  runs against it. THREE CONTAINERS here:
#                                  innsegl-object-store holds the bytes,
#                                  innsegl-object-filer the metadata, and
#                                  innsegl-s3 is the gateway — the only one of
#                                  the three that enforces object lock, and the
#                                  only one anything else can reach
#   innsegl-mcp         built      The MCP server (register/credential/event/
#                                  sign/retire). ONLY SERVICE HOLDING THE SPIRE
#                                  ADMIN CREDENTIAL
#   innsegl-reconciler  built      Intent expiry, Rekor cross-check, drift
#                                  detection (same binary, subcommand)
#   innsegl-sealer      built      Segment sealing + anchoring
#                                  (same binary, subcommand)
#   innsegl-dashboard   built      Read-only UI + BFF proof checks. No write
#                                  credentials mounted — enforced by giving it
#                                  a read-only DB role. TWO SERVICES here:
#                                  innsegl-dashboard is the UI, innsegl-api is
#                                  the BFF and the thing that holds the
#                                  read-only role
#   demo-agent          built      Scripted agent that registers, makes a
#                                  scratch-repo commit, retires. This is the
#                                  OPS-004 smoke test body
#
# and one requirement about how they are wired:
#
#   "Network segmentation even in compose: `spire-server` admin API and
#    `postgres` write role reachable only from the services that need them;
#    `innsegl-dashboard` on a network with read-only DB role and the proof
#    endpoints. Compose is where the least-privilege shape is first proven, not
#    first ignored."
#
# NONE OF THESE SEVEN EXISTED BEFORE #109. What shipped was the two dependency
# stacks plus whatever each test harness stood up for itself with plain
# `docker run` — so "the reference deployment" named no artifact anyone could
# point at, and the MCP ran as the database owner while printing
# DATABASE ROLE IS OVER-PRIVILEGED on an adopter's first contact with it.
#
# HOW TO RUN IT — see innsegl/README.md and ../README.md. Short version:
#   export INNSEGL_SPIRE_JWT_ISSUER=http://spire-oidc:8080
#   docker compose -f deploy/compose/spire.yml up -d
#   deploy/compose/spire/register.sh
#   docker compose -f deploy/compose/sigstore.yml up -d
#   docker compose -f deploy/compose/innsegl.yml build
#   deploy/compose/spire/register.sh          # now registers innsegl-mcp too
#   docker compose -f deploy/compose/innsegl.yml up -d
#
# WHAT IS STILL NOT HERE, said plainly rather than left to be discovered:
#   * AUTHENTICATION, in front of the dashboard or the query API. `innsegl api`
#     authenticates nobody and authorises nothing, and says so in its own usage;
#     doc 05 §3 puts dashboard.innsegl.dev behind Cloudflare Access and RM-062
#     (#70) is the issue that does it. Nothing here invents a scheme in the
#     meantime, and neither service publishes a port on anything but loopback.
#     What IS enforced is the half that survives a misconfigured proxy: the
#     credential the query API holds cannot write, whoever reaches it.
#
# The dashboard's BFF used to be on that list. #121 landed `innsegl api` and
# this file now runs it (innsegl-api), behind the read-only role
# innsegl-db-init provisions from internal/api/readonly.sql.
#
# `innsegl seal`'s operator surface was #112's, written in parallel with this
# file. The sealer service below was written against the conventions
# `reconcile` and `reap` had already set, before #112 landed, and then checked
# against it: every variable it sets is one cmd/innsegl/seal.go reads, and it
# passes no flags. See the service for the full note.
# ============================================================================

name: innsegl-core

# ----------------------------------------------------------------------------
# Pinned images. Doc 05 §1: "pin versions". Pinned twice — by release tag,
# which says what this is, and by digest, which says what it *is*. A tag alone
# is mutable at the registry; the digest is what docker actually verifies.
# Same discipline as spire.yml and sigstore.yml.
# ----------------------------------------------------------------------------
x-postgres-image: &postgres-image
  postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
# MEASURED-VERSION PIN, not a convenience pin. internal/segment's WORM harness
# pins this exact release because "the whole subject of SEG-005 is one server's
# object-lock enforcement, so the version that enforcement was observed in is
# part of the evidence". The reference deployment runs the version the evidence
# was taken against.
#
# THE STORE CHANGED IN RM-143 (#227). What was here was archived upstream and
# delisted from the registry this file pulled it from — a reference deployment
# whose object store cannot be fetched is not a reference deployment. The
# replacement is maintained, Apache-2.0, and was measured against SEG-005 under
# exactly the configuration below: bucket default rule set at creation, the
# writer setting no retention of its own, every check green.
x-object-store-image: &object-store-image
  chrislusf/seaweedfs:4.46@sha256:08d516132314207d10c8e37cbffc1f32b147d870169688734cc61c6231625b62
# The S3 client the one-time bucket init and its verifier run in. It is the
# reference implementation of the protocol rather than any one server's own
# tool, which is the point: what was here before was the client that shipped
# with the store being replaced, so the init could not outlive it. This one
# speaks `s3api` — create-bucket --object-lock-enabled-for-bucket,
# put-object-lock-configuration, get-object-lock-configuration — and those are
# the three calls doc 05 §1's "buckets created with lock on" actually is.
x-s3-client-image: &s3-client-image
  amazon/aws-cli:2.31.19@sha256:4532e423f4e4f1092b3b1fb7819278a1f4baa3564f428182e399669d9c8f9e95
# Used once, by the one-shot that mints this deployment's pseudonymisation
# secret, and it is the SAME pin sigstore.yml uses for sigstore-bootstrap. The
# innsegl image could have generated the secret itself, but that would put key
# generation inside the binary that holds SPIRE admin; a short shell script in
# a container with no network at all is a smaller thing to get right.
x-openssl-image: &openssl-image
  alpine/openssl:3.5.7@sha256:19f8eb9004a1dbaec323eed6094e9b6bcc1dbf2697ecb5fb8d2fad4e3336a8f7

# ----------------------------------------------------------------------------
# The ledger's credentials.
#
# NOT A SECRET BOUNDARY, and saying so is the point of writing it here. These
# values sit in a compose file and end up in `docker inspect`. What protects
# the ledger in this stack is the network membership below — `innsegl-ledger`
# is internal and has five members — and, for the MCP specifically, the
# append-only ROLE, which is a boundary a leaked password does not cross: the
# credential the MCP holds cannot delete an event no matter who holds it.
#
# A real deployment overrides both from a secret store. doc 05 §2's production
# sketch is where that belongs; this is the compose default.
# ----------------------------------------------------------------------------
x-ledger-database: &ledger-database innsegl
x-ledger-owner: &ledger-owner innsegl
x-ledger-owner-password: &ledger-owner-password ${INNSEGL_LEDGER_OWNER_PASSWORD:-innsegl-compose-owner}

# doc 05 §1's append-only role. The MCP, the reconciler and the sealer connect
# as this and nothing else connects as it. innsegl/appendonly.sql is what it
# may do and innsegl/verify-role.sh is what proves it.
x-appender-role: &appender-role innsegl_appender
x-appender-password: &appender-password ${INNSEGL_LEDGER_APPENDER_PASSWORD:-innsegl-compose-appender}

# doc 05 §1's read-only role — FD §7's "no credentials capable of writing
# anywhere", as a ROLE rather than as the absence of write code. `innsegl-api`
# connects as this and NOTHING ELSE DOES. internal/api/readonly.sql is what it
# may do, innsegl/verify-reader-role.sh is what proves it at provisioning time,
# and `innsegl api` asks the same question again at every start-up — exit 13
# WRITABLE if the answer is "write", with no flag to switch the check off.
#
# THE PASSWORD IS A SEPARATE VARIABLE FROM THE APPENDER'S, deliberately.
# cmd/innsegl/api.go made the same choice for the DSN: "One name for two
# different roles is a deployment that can hand the dashboard the writer by
# copying a line."
x-reader-role: &reader-role innsegl_reader
x-reader-password: &reader-password ${INNSEGL_LEDGER_READER_PASSWORD:-innsegl-compose-reader}

# doc 05 §1's BACKUP role (RM-146, #237). The reader's grants over the ledger,
# plus CREATEDB — and CREATEDB only because the backup proves a dump restores by
# restoring it into a throwaway database of its own. `innsegl-backup` connects as
# this and NOTHING ELSE DOES.
#
# WHAT IT REPLACES IS WORSE. Until now the backup ran on the HOST, from a
# scheduler, reaching the database through the container runtime — so the thing
# taking backups held the runtime socket, which is root on the machine. This
# credential can read the ledger and own throwaway databases. It cannot write
# the ledger, and innsegl/verify-backup-role.sh proves both halves against the
# server rather than trusting the GRANTs that produced them.
#
# ITS OWN VARIABLE, for the reason the reader's is its own: "One name for two
# different roles is a deployment that can hand the dashboard the writer by
# copying a line."
x-backup-role: &backup-role innsegl_backup
x-backup-password: &backup-password ${INNSEGL_LEDGER_BACKUP_PASSWORD:-innsegl-compose-backup}

# THE OBJECT STORE'S ROOT ACCOUNT. It reaches TWO things: the server, and the
# one-shot that creates the locked bucket. Nothing that stays up holds it, and
# that separation is the whole of RM-144 (#228).
#
# Bucket creation is a one-time setup step. S3 object lock can only be enabled
# at creation and only an account that may set a bucket configuration can put
# the default retention rule on it, so the init genuinely needs this credential
# — for the length of one container that exits. The sealer writes objects and
# does nothing else, and it used to be handed this same value.
#
# WHY IT MATTERS ON A STACK WHOSE STORE HAS NO PUBLISHED PORT. The network
# below is `internal:` with three members and that control is real. It assumes
# an attacker who is not on the host. A process ON the host with a container
# runtime is effectively root there — it reads a running container's
# environment and attaches a container of its own to any network — so the
# defensible position is not that the credential cannot be reached, but that
# the one it finds cannot weaken anything. doc 04 AB-17.
x-object-store-user: &object-store-user ${INNSEGL_OBJECT_STORE_ACCESS_KEY:-innsegl}
x-object-store-password: &object-store-password ${INNSEGL_OBJECT_STORE_SECRET_KEY:-innsegl-compose-objects}
x-object-store-bucket: &object-store-bucket ${INNSEGL_OBJECT_STORE_BUCKET:-innsegl-segments}

# GATES THE FILER'S IAM gRPC SERVICE. The filer registers CreateUser, PutPolicy
# and CreateAccessKey on its gRPC port and says so itself at start-up:
# "Registered IAM gRPC service on filer (unauthenticated; set jwt.filer_signing.key
# ... to require admin Bearer token)". `-disableHttp` does not reach it — that
# closes the HTTP surface and this is gRPC on 18888.
#
# Upstream's own rule is "set the key ... if the gRPC port is reachable beyond a
# trusted network", and here it is not: innsegl-object-backend is `internal:`
# with three members, and measured 2026-09-18 the name does not resolve from the
# MCP while it does from innsegl-s3. So this is a second lock rather than the
# only one — the same position telemetry ended up in on the same day.
#
# A SHIPPED DEFAULT, for the reason AB-17 gives above for the object store's own
# credentials: the network control assumes an attacker who is not on the host,
# and a process on the host reads any container's environment anyway. What
# matters is that what this gates cannot weaken anything — it admits IAM calls
# to a gateway run with -iam=false against a static identities file, so there is
# no user or policy for them to create.
x-object-filer-jwt: &object-filer-jwt ${INNSEGL_OBJECT_FILER_JWT_KEY:-innsegl-compose-filer-admin}

# THE SCOPED IDENTITY every long-running service that talks to the store runs
# as. innsegl/s3-identities.sh writes it into the gateway's identity file, and
# innsegl/verify-object-scope.sh then asks the server what that credential can
# really do — because an identity file is provisioning, provisioning is a
# claim, and one line added to it later is invisible to any amount of review.
#
# THE GRANT IS PREFIX-SCOPED, AND ON THIS STORE THAT IS THE WHOLE CONTROL
# (RM-143, #227). Measured on the shipped image: the gateway's permission model
# has no separate action for setting a bucket's object-lock configuration — an
# identity granted a bucket-wide `Write` may set it, and may therefore downgrade
# the default rule from COMPLIANCE to GOVERNANCE. The same identity granted
# `Write:<bucket>/<prefix>*` instead may write every object the sealer writes
# and is REFUSED that call with AccessDenied, along with creating a bucket,
# deleting one, suspending versioning, and putting a bucket policy or lifecycle
# rule. So the narrowing is expressed as a prefix and not as a permission name,
# and OPS-026 measures it.
#
# TWO WRITE GRANTS, NOT ONE. The sealer writes under $INNSEGL_OBJECT_STORE_PREFIX;
# SEG-005's canary writes its probe under internal/segment's own
# `innsegl-worm-canary/`, deliberately outside the segment namespace so that
# scripts/backup-ledger.sh's recursive fetch of the segment prefix does not pull
# probes. Both are granted, and nothing else in the bucket is writable.
#
# NOTE WHAT IS NOT CLAIMED. This does not protect sealed history: COMPLIANCE
# retention already refuses deletion by anyone, the account that wrote it
# included — measured against this store's own root identity, which is refused
# the shortening, the downgrade and the delete. What it protects is FUTURE
# writes, by making the rule that governs them unreachable from anything
# long-running.
#
# THE SECRET IS DERIVED WHEN UNSET, NOT REQUIRED, and innsegl/s3-identities.sh
# derives it the same way from the root secret. An operator upgrading an
# existing deployment has set $INNSEGL_OBJECT_STORE_SECRET_KEY once and never
# heard of this issue; a narrowing that needed a new variable before the stack
# came up would be switched off rather than adopted. Setting
# $INNSEGL_OBJECT_STORE_SEALER_SECRET_KEY takes over from the derivation, which
# is what a deployment holding the two in a secret manager wants.
x-object-store-sealer-user: &object-store-sealer-user ${INNSEGL_OBJECT_STORE_SEALER_ACCESS_KEY:-innsegl-sealer}
x-object-store-sealer-password: &object-store-sealer-password ${INNSEGL_OBJECT_STORE_SEALER_SECRET_KEY:-${INNSEGL_OBJECT_STORE_SECRET_KEY:-innsegl-compose-objects}-sealer}

# THE SEGMENT KEY PREFIX, declared once because THREE things have to agree on
# it: the sealer writes under it, the scoped identity is granted write access to
# exactly it, and scripts/backup-ledger.sh fetches it recursively. A value that
# drifts between the sealer and the identity file is a stack whose sealer
# authenticates and is then refused every write.
x-object-store-prefix: &object-store-prefix ${INNSEGL_OBJECT_STORE_PREFIX:-segments/}

# WHERE THE GATEWAY READS ITS IDENTITIES FROM. The path, never the values: the
# file carries this deployment's two S3 secrets, so it is minted into a volume
# by a one-shot with no network (innsegl-s3-identities) exactly as the
# pseudonymisation secret is, and never sits in this file or in `docker inspect`
# as a mounted literal.
x-s3-identities-file: &s3-identities-file /run/innsegl/s3/identities.json

# ----------------------------------------------------------------------------
# The trust domain and the two Sigstore endpoints, as reached from INSIDE the
# container networks. `fulcio` and `rekor` are sigstore.yml's service names on
# the `innsegl-sigstore` network this file joins.
# ----------------------------------------------------------------------------
x-trust-domain: &trust-domain innsegl.dev
x-fulcio-url: &fulcio-url http://fulcio:5555
# The transparency log. Defaults to the Rekor this compose file starts, which
# is what a development stack wants: fast, offline, and free to destroy.
#
# ADR-0042 is the reason this is a variable rather than a constant. It decides
# that "anyone can verify" means a PUBLIC Rekor anchor over this deployment's
# own Fulcio root — Sigstore's documented bring-your-own-PKI path — and the Go
# side already supports it: INNSEGL_REKOR_URL is read by serve, seal, reconcile
# and verify, and cmd/innsegl/init.go already carries
# defaultPublicRekorURL = "https://rekor.sigstore.dev". This line was the only
# thing standing in the way.
#
#   INNSEGL_REKOR_URL=https://rekor.sigstore.dev
#
# Two things follow from setting it, and both are permanent:
#
#   - Rekor is append-only and public. Nothing submitted can be withdrawn. What
#     is published is the certificate, its timestamp and the log index; the
#     SPIFFE ID it carries is pseudonymised under ADR-0041, so it is opaque
#     without this deployment's ledger. ADR-0042 is materially worse without
#     ADR-0041 and the two should be read together.
#   - The deployment's Fulcio root has to be published and reachable, or the
#     entry proves a time for a certificate nobody can chain. ADR-0042 leaves
#     where and how deliberately unsettled.
#
# The sigstore Rekor containers keep running when this is set. Stopping them is
# a separate operator decision, not something this line makes for anyone.
x-rekor-url: &rekor-url ${INNSEGL_REKOR_URL:-http://rekor:3000}

# The issuer, and the same variable spire.yml and sigstore.yml read. `innsegl
# verify` is handed it so a certificate naming a different issuer is a failure
# rather than a curiosity (ADR-0029 decision 3).
x-jwt-issuer: &jwt-issuer ${INNSEGL_SPIRE_JWT_ISSUER:?set it to the issuer ALL THREE stacks use - http://spire-oidc:8080 for the compose default. `make innsegl-up` does this for you}

# ----------------------------------------------------------------------------
# THE ATTESTED NODE.
#
# Every SPIRE entry the MCP creates is parented to the attested agent, and an
# entry with no reachable parent is an entry no workload can ever match — which
# is why `innsegl serve` requires this and refuses to start without it.
#
# It is not knowable in advance: the agent's SPIFFE ID is
# spiffe://innsegl.dev/spire/agent/x509pop/<sha1 of the agent certificate>, and
# spire/bootstrap.sh mints a fresh certificate for every `up` after a `down -v`.
# So `deploy/compose/spire/register.sh` writes it to deploy/compose/.env, which
# compose reads automatically, and this is `:?` rather than defaulted for the
# same reason sigstore.yml's issuer is: a wrong value here fails much later and
# much less legibly than a missing one.
# ----------------------------------------------------------------------------
x-parent-id: &parent-id ${INNSEGL_SPIRE_PARENT_ID:?run deploy/compose/spire/register.sh first - it writes deploy/compose/.env with the attested node ID this stack must parent its entries to}

# ----------------------------------------------------------------------------
# THIS DEPLOYMENT'S PSEUDONYMISATION SECRET — the PATH to it, never the value.
#
# `innsegl serve` defaults to `-identity-mode pseudonymous`, and in that mode
# `internal/identity` refuses to start without a secret of at least 16 bytes.
# #119 introduced that refusal deliberately; this file was not updated to
# supply one, so innsegl-mcp crashlooped on a clean `up` (#124).
#
# WHY THERE IS NO SECRET IN THIS FILE. A pseudonym is
# `HMAC(deployment_secret, field ‖ ":" ‖ value)` and the DEPLOYMENT half is the
# entire design (ADR-0041). A constant shipped here would give every
# installation the same pseudonyms — `a7f3c91b` would mean one particular
# ticket reference everywhere, and one resolved mapping would resolve it for
# everybody — which is worse than not pseudonymising at all, because it looks
# private and is not. So innsegl-identity-init below mints one per deployment
# into a volume, and this is the path it writes and innsegl-mcp reads.
#
# DECLARED ONCE, AS AN ANCHOR, for sigstore.yml's stated reason: it is used by
# a writer and a reader, and two copies of a default is how they come to
# disagree. It is also the variable NAME `innsegl serve` reads the path from
# (`INNSEGL_IDENTITY_SECRET_FILE`, joining `INNSEGL_MCP_SVID_FILE` and its two
# siblings), because compose cannot inject a file's contents into an
# environment variable and a secret does not belong on a command line the
# process table can read.
# ----------------------------------------------------------------------------
x-identity-secret-file: &identity-secret-file /run/innsegl/identity/secret

# ----------------------------------------------------------------------------
# #264 — THE IDENTITY LIFECYCLE'S CREDENTIAL. Two paths, never the key.
#
# WHAT WAS WRONG. The listener split below moves the six tools that CREATE and
# DESTROY identities onto their own port, and nothing authenticated a caller on
# it: any process that could reach it could mint a run, which is doc 04's AB-13
# and AB-15. The note above INNSEGL_MCP_ADMIN_LISTEN said "Do NOT turn this on
# until something is arranged to do the registering" — and it was on.
#
# WHAT CLOSES IT. A repository-scoped credential, verified OFFLINE against the
# public key set below. `innsegl serve` now REFUSES TO START when the listener
# is on and the key set is absent, so this stack mints one on its first `up`.
#
# TWO VOLUMES, NOT ONE, and that separation is E8. The MCP mounts the PUBLIC
# key set and never the private half; nothing in this stack but the one-shot
# that writes it, and an operator running `innsegl admin-credential mint`, can
# reach the signing key at all.
#
# EMPTY UNLESS THE SPLIT IS ON. Both expand to nothing when
# INNSEGL_MCP_ADMIN_LISTEN is unset, which is this file's default and every
# deployment before it: `serve` refuses a key set with no listener to protect,
# because a file that is read and never used reads as a control that is on.
# The paths are written out inside the expansion rather than anchored a second
# time because compose cannot interpolate a YAML anchor into one — these two
# lines are the single spelling of each, and everything else references them.
# ----------------------------------------------------------------------------
x-admin-jwks-file: &admin-jwks-file ${INNSEGL_MCP_ADMIN_LISTEN:+/run/innsegl/admin/jwks.json}
x-admin-key-file: &admin-key-file ${INNSEGL_MCP_ADMIN_LISTEN:+/run/innsegl/admin-key/signing.key}

# ----------------------------------------------------------------------------
# The one image the three innsegl-* services share. doc 05 §1 says "same
# binary, subcommand" for the reconciler and the sealer; they differ from the
# MCP and from each other only by `command:`.
# ----------------------------------------------------------------------------
x-innsegl-build: &innsegl-build
  image: ${INNSEGL_IMAGE:-innsegl:local}
  build:
    context: ../..
    dockerfile: Dockerfile
    # PINNED, because the default is whatever stage is last in the Dockerfile,
    # and that is not a property this file should depend on. See the Runtime
    # stage's own comment for what it cost when a stage was appended after it.
    target: runtime
    args:
      VERSION: ${INNSEGL_VERSION:-compose}
      COMMIT: ${INNSEGL_COMMIT:-unknown}
      DATE: ${INNSEGL_BUILD_DATE:-unknown}

services:

  # --------------------------------------------------------------------------
  # postgres — doc 05 §1's ledger hot tier.
  #
  # IT PUBLISHES NO HOST PORT, AND THAT IS LOAD-BEARING RATHER THAN TIDY.
  # MEASURED by RM-054 (#62): publishing a container's port to the host inserts
  # an ACCEPT rule for that container's address into Docker's own filter chain,
  # and the rule is matched BEFORE the isolation rules that keep one bridge
  # network out of another. A published Postgres is reachable, BY ADDRESS, from
  # a container on an unrelated network — so `ports:` here would not be a
  # convenience, it would be a hole in the segmentation that no `networks:`
  # declaration describes.
  #
  # An operator who needs psql uses `docker compose exec postgres psql`, which
  # crosses no network at all.
  #
  # NETWORKS: innsegl-ledger (the writers) and innsegl-ledger-readonly (the
  # dashboard's BFF). Both internal.
  # --------------------------------------------------------------------------
  postgres:
    image: *postgres-image
    container_name: innsegl-postgres
    restart: unless-stopped
    networks:
      - innsegl-ledger
      - innsegl-ledger-readonly
    environment:
      POSTGRES_USER: *ledger-owner
      POSTGRES_PASSWORD: *ledger-owner-password
      POSTGRES_DB: *ledger-database
      # The initdb locale, fixed. A collation that varies by host is a text
      # index that sorts differently on two machines reading one volume.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - innsegl-ledger-data:/var/lib/postgresql/data
    # fsync stays ON. LED-009 asserts that an acknowledged append survives a
    # SIGKILL, and a ledger that loses a committed event is not a ledger.
    command: ["-c", "fsync=on"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innsegl -d innsegl"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------------------------
  # innsegl-db-init — one-shot. Not a doc 05 §1 row; the same kind of thing as
  # spire.yml's spire-bootstrap and sigstore.yml's sigstore-bootstrap.
  #
  # It applies the shipped migrations AS THE OWNER, provisions BOTH of doc 05
  # §1's non-owner roles — the append-only role the MCP writes through and the
  # read-only role the query API reads through — and then, the part that
  # matters, connects as each of them in turn and asks the server what that
  # credential can actually do. It exits non-zero if the appender can delete or
  # the reader can write, and everything that touches the ledger below gates on
  # its completion, so neither an over-privileged MCP nor an over-privileged
  # dashboard backend can start at all.
  #
  # innsegl/db-init.sh has the reasoning; internal/api/readonly.go is the model
  # and says why the assertion matters more than the provisioning.
  # --------------------------------------------------------------------------
  innsegl-db-init:
    image: *postgres-image
    container_name: innsegl-db-init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - innsegl-ledger
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: *ledger-owner
      PGPASSWORD: *ledger-owner-password
      PGDATABASE: *ledger-database
      INNSEGL_APPENDER_ROLE: *appender-role
      INNSEGL_APPENDER_PASSWORD: *appender-password
      INNSEGL_READER_ROLE: *reader-role
      INNSEGL_READER_PASSWORD: *reader-password
      INNSEGL_BACKUP_ROLE: *backup-role
      INNSEGL_BACKUP_PASSWORD: *backup-password
    volumes:
      - ./innsegl:/innsegl/init:ro
      # The SHIPPED migrations, read straight from the repository. Not a copy:
      # a second copy of migrations/*.sql is a schema that can drift from the
      # code that writes to it, which is the whole reason the Go runner embeds
      # them rather than reading them from disk.
      - ../../migrations:/innsegl/migrations:ro
      # internal/api/readonly.sql — THE READ-ONLY GRANTS, MOUNTED FOR EXACTLY
      # THE REASON THE MIGRATIONS ARE.
      #
      # api.EnsureReadOnlyRole `//go:embed`s this file, and `innsegl api` probes
      # the credential against what it produced before it will serve a request.
      # A second copy of those GRANTs under deploy/ would be a read-only posture
      # that could drift from the one the API measures against, and the failure
      # mode of that drift is an innsegl-api that exits 13 WRITABLE in a stack
      # whose own bootstrap reported the role fine. db-init.sh translates Go's
      # two fmt verbs into psql's :"role" and :"db" on the way in, and refuses
      # loudly if the file ever grows a third.
      - ../../internal/api/readonly.sql:/innsegl/api/readonly.sql:ro
    entrypoint: ["sh", "/innsegl/init/db-init.sh"]
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------------------------
  # THE OBJECT STORE — doc 05 §1's "Object storage with object lock enabled.
  # Buckets created with lock on; SEG-005 canary runs against it."
  #
  # IT IS THREE CONTAINERS AND THAT IS NOT AN IMPLEMENTATION DETAIL (RM-143,
  # #227). This store is a storage layer (master + volume), a metadata layer
  # (the Filer) and an S3 gateway, and the gateway is the ONLY one of the three
  # that enforces object lock.
  #
  # MEASURED, on the pinned image, against an object under COMPLIANCE retention
  # that the gateway refuses to delete for EVERY identity including the store's
  # own root account:
  #
  #     curl -X DELETE http://<filer>:8888/buckets/<bucket>/<key>   -> 204
  #     the object is gone; the S3 layer reports NoSuchKey
  #
  # No credential. No signature. One request. The Filer's HTTP API is a second
  # door to the same bytes and it has no lock on it, so the lock is only worth
  # what the reachability of that door is worth. Two things close it here and
  # both are load-bearing:
  #
  #   1. THE FILER'S HTTP API IS SWITCHED OFF AT THE PROCESS (`-disableHttp`).
  #      The gateway reaches the Filer over gRPC, which that flag leaves alone
  #      — measured: the whole stack, including SEG-005's canary, works with
  #      the HTTP listener gone.
  #   2. THE FILER IS ON A NETWORK NOTHING BUT THE GATEWAY JOINS. The sealer,
  #      the canary and the one-time init are on innsegl-objects and reach the
  #      gateway; innsegl-object-backend has exactly three members and the
  #      gateway is the only one on both.
  #
  # OPS-029 attempts that delete from the object network and requires it to
  # find nothing. The same arrangement in ONE process — the store's `server
  # -s3` mode — publishes both doors on one bind address, so splitting them is
  # what makes the isolation expressible at all.
  #
  # NO PUBLISHED PORT ANYWHERE IN THE THREE: see postgres for why a published
  # port is a segmentation hole here rather than a convenience.
  # --------------------------------------------------------------------------

  # --------------------------------------------------------------------------
  # innsegl-object-store — master and volume. Holds the BYTES.
  #
  # It is on the backend network only, and it is worth saying what that buys
  # and what it does not: its own HTTP APIs accept unauthenticated writes and
  # deletes of raw needles from anything that can reach them (measured). There
  # is no credential to scope here, so reachability IS the control.
  # --------------------------------------------------------------------------
  innsegl-object-store:
    image: *object-store-image
    container_name: innsegl-object-store
    restart: unless-stopped
    networks:
      - innsegl-object-backend
    volumes:
      - innsegl-object-data:/data
    # -ip: the address this advertises to the rest of the cluster. It has to be
    # the name the Filer and the gateway resolve, not the container's own
    # auto-detected address, or a volume lookup hands back something they
    # cannot route to.
    command:
      - server
      - -dir=/data
      - -ip=innsegl-object-store
      # EACH BUCKET IS A COLLECTION AND A NEW COLLECTION IMMEDIATELY RESERVES
      # SEVEN VOLUMES; the default cap is eight. This deployment has one
      # bucket, so the default would hold — but a write with nowhere to go
      # comes back as HTTP 500 "We encountered an internal error, please try
      # again" (measured), which is indistinguishable from a transient fault
      # and says nothing about capacity. Volumes are sparse: eight of them
      # measured 256 KiB on disk. Raising the cap costs nothing and moves the
      # failure to a place an operator can read.
      - -volume.max=32

      # TELEMETRY, OFF. The master reports cluster statistics to
      # https://telemetry.seaweedfs.com/api/collect every 24h once 10 GiB are
      # stored, and the upstream default is ON. The payload is the cluster's
      # shape — version, host OS, volume-server/volume/filer counts, total bytes
      # — and, unavoidably, the source address, which is the operator's. None of
      # that is this deployment's to send.
      #
      # innsegl-object-backend is `internal: true`, so the call cannot leave and
      # the hostname does not even resolve (measured 2026-09-18: SERVFAIL, so not
      # even the DNS query escapes). This flag is the second lock. The network is
      # a property of the topology and a topology gets edited; this is a property
      # of the process, and the two fail independently.
      #
      # THE FLAG IS NOT THE ONE THE LOG SUGGESTS. The startup banner says "use
      # -telemetry=false to opt out". That is the standalone `weed master`
      # spelling. This deployment runs `weed server`, which prefixes every master
      # flag and rejects the banner's advice outright — measured against the
      # pinned image:
      #
      #   weed server -telemetry=false  ->  flag provided but not defined
      #
      # which does not warn, it crashloops the object store. Anyone acting on the
      # log line alone breaks the deployment, so the working spelling is written
      # down here next to the reason.
      - -master.telemetry=false
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9333/cluster/healthz || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------------------------
  # innsegl-object-filer — the metadata layer, with its HTTP door removed.
  #
  # `-disableHttp` leaves gRPC, which is what the gateway uses, and takes away
  # the unauthenticated delete described above. `-disableDirListing` is
  # belt-and-braces for the same surface.
  #
  # ITS OWN STORE IS ON A VOLUME. The Filer keeps the bucket and object
  # metadata in an embedded database under -defaultStoreDir; without a volume a
  # restart would leave the bytes in innsegl-object-data addressable by nothing.
  #
  # NO HEALTHCHECK, said plainly rather than left as an omission: with HTTP off
  # there is no endpoint to ask. What gates everything downstream is
  # innsegl-object-init, which retries an AUTHENTICATED S3 call until it works
  # — and that call only works when all three of these are up and linked.
  # --------------------------------------------------------------------------
  innsegl-object-filer:
    image: *object-store-image
    container_name: innsegl-object-filer
    restart: unless-stopped
    depends_on:
      innsegl-object-store:
        condition: service_healthy
    networks:
      - innsegl-object-backend
    volumes:
      - innsegl-object-filer-data:/data
    environment:
      # See x-object-filer-jwt. Set here and NOT on innsegl-s3: the gateway runs
      # -iam=false against a static identities file and makes no IAM call, and
      # this same key doubles as the S3 STS fallback signer — behaviour this
      # deployment has no reason to acquire.
      WEED_JWT_FILER_SIGNING_KEY: *object-filer-jwt
    command:
      - filer
      - -master=innsegl-object-store:9333
      - -ip=innsegl-object-filer
      - -defaultStoreDir=/data
      - -disableHttp
      - -disableDirListing
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------------------------
  # innsegl-s3 — the gateway. The ONLY thing in this stack that enforces object
  # lock, and the only member of both object networks.
  #
  # IT SHIPS NO DEFAULT CREDENTIALS, and this is the failure that reads like
  # something else. Without -config every signed request is refused with
  # "Signed request requires setting up SeaweedFS S3 authentication", which a
  # caller sees as AccessDenied on a write and can easily mistake for object
  # lock working. innsegl-s3-identities mints the file; this gates on it.
  #
  # THREE LISTENERS ARE TURNED OFF because none of them is part of storing a
  # sealed segment and each is an authenticated write surface on a service
  # whose entire job is refusing writes to sealed objects. This is the same
  # argument the old store's disabled browser console carried:
  #
  #   -iam=false        an IAM API served on the S3 port itself
  #   -port.iceberg=0   an Iceberg REST catalog
  #   -port.lance=0     a Lance namespace server
  # --------------------------------------------------------------------------
  innsegl-s3:
    image: *object-store-image
    container_name: innsegl-s3
    restart: unless-stopped
    depends_on:
      innsegl-object-filer:
        condition: service_started
      innsegl-s3-identities:
        condition: service_completed_successfully
    networks:
      - innsegl-object-backend
      - innsegl-objects
    volumes:
      # READ-ONLY, and the only other mount of this volume is the one-shot that
      # writes it. A gateway that could rewrite its own identity file could
      # grant itself the bucket-wide Write that OPS-026 exists to withhold.
      - innsegl-s3-identities:/run/innsegl/s3:ro
    command:
      - s3
      - -filer=innsegl-object-filer:8888
      - -port=8333
      - -config=/run/innsegl/s3/identities.json
      - -iam=false
      - -port.iceberg=0
      - -port.lance=0
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8333/healthz || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------------------------
  # innsegl-s3-identities — one-shot. Writes the gateway's identity file.
  #
  # innsegl-identity-init's shape and for its reasons: it produces a file full
  # of this deployment's secrets, it needs to reach nothing to do that, so it
  # reaches nothing (`network_mode: none`, which also costs zero of #100's
  # roughly twenty-nine networks), and it is the only container that mounts the
  # volume rw.
  #
  # NOT IDEMPOTENT IN THE "LEAVE IT ALONE" SENSE, unlike the pseudonymisation
  # secret: it rewrites the file every boot from the compose file's own
  # interpolation. That is deliberate. The identity file is not key material to
  # be preserved, it is the compose file's access-control decision rendered into
  # the format the gateway reads, and a stale one is a deployment whose scope
  # is whatever it was the first time it ever came up.
  # --------------------------------------------------------------------------
  innsegl-s3-identities:
    image: *object-store-image
    container_name: innsegl-s3-identities
    network_mode: none
    restart: "no"
    entrypoint: ["/bin/sh"]
    command: ["/innsegl/init/s3-identities.sh"]
    environment:
      INNSEGL_S3_IDENTITIES_FILE: *s3-identities-file
      INNSEGL_OBJECT_STORE_ACCESS_KEY: *object-store-user
      INNSEGL_OBJECT_STORE_SECRET_KEY: *object-store-password
      INNSEGL_OBJECT_STORE_SEALER_ACCESS_KEY: *object-store-sealer-user
      INNSEGL_OBJECT_STORE_SEALER_SECRET_KEY: *object-store-sealer-password
      INNSEGL_OBJECT_STORE_BUCKET: *object-store-bucket
      INNSEGL_OBJECT_STORE_PREFIX: *object-store-prefix
    volumes:
      - ./innsegl:/innsegl/init:ro
      # THE ONLY rw MOUNT OF THIS VOLUME ANYWHERE IN THE STACK.
      - innsegl-s3-identities:/run/innsegl/s3
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------------------------
  # innsegl-object-init — one-shot. Creates the segment bucket WITH OBJECT LOCK
  # and sets a default retention, then proves the lock took and proves the
  # scoped identity cannot undo it.
  #
  # "CREATED WITH LOCK ON" IS THE WHOLE OF IT. S3 object lock can only be
  # enabled AT BUCKET CREATION; a bucket made without it can never be given it,
  # and there is no repair path short of a new bucket and a copy of every
  # sealed segment. Measured on this store: a create call that reports success
  # can still leave a bucket with no lock configuration at all, so the gate is
  # the configuration READ BACK off the server and never the exit status of the
  # create (OPS-030).
  # --------------------------------------------------------------------------
  innsegl-object-init:
    image: *s3-client-image
    container_name: innsegl-object-init
    restart: "no"
    depends_on:
      innsegl-s3:
        condition: service_healthy
    networks:
      - innsegl-objects
    environment:
      INNSEGL_OBJECT_STORE_URL: http://innsegl-s3:8333
      INNSEGL_OBJECT_STORE_ACCESS_KEY: *object-store-user
      INNSEGL_OBJECT_STORE_SECRET_KEY: *object-store-password
      INNSEGL_OBJECT_STORE_BUCKET: *object-store-bucket
      INNSEGL_OBJECT_STORE_PREFIX: *object-store-prefix
      # The scoped identity this one-shot measures. Passed rather than left to
      # the script's own default so that the value the sealer is handed and the
      # value the gateway was given are ONE interpolation of ONE expression;
      # two copies of a derivation rule is a stack that starts and then cannot
      # authenticate.
      INNSEGL_OBJECT_STORE_SEALER_ACCESS_KEY: *object-store-sealer-user
      INNSEGL_OBJECT_STORE_SEALER_SECRET_KEY: *object-store-sealer-password
      # doc 05 §2: "Object lock in compliance mode with a retention window >=
      # the organization's audit horizon". One day is the COMPOSE window — long
      # enough that SEG-005's deletion canary has something real to be refused
      # by, short enough that a developer's laptop is not carrying undeletable
      # demo objects for seven years. A deployment sets its own.
      #
      # THE WINDOW IS SET HERE AND ONLY HERE, and the variable is deliberately
      # not $INNSEGL_OBJECT_STORE_RETENTION — see the sealer service below.
      INNSEGL_OBJECT_LOCK_RETENTION: ${INNSEGL_OBJECT_LOCK_RETENTION:-1d}
      INNSEGL_OBJECT_STORE_RETENTION_MODE: ${INNSEGL_OBJECT_STORE_RETENTION_MODE:-COMPLIANCE}
      # The client's own defaults would otherwise send a trailing checksum
      # header this gateway answers with a signature mismatch (measured). The
      # request is identical either way; only the framing differs.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    volumes:
      - ./innsegl:/innsegl/init:ro
    entrypoint: ["sh", "/innsegl/init/object-init.sh"]
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------------------------
  # innsegl-identity-init — one-shot. Mints THIS deployment's pseudonymisation
  # secret (RM-084, #124), in sigstore-bootstrap's shape and for its reasons.
  #
  # Not a doc 05 §1 row, and the same kind of thing as innsegl-db-init: it runs
  # to completion, everything that needs what it produced gates on that, and it
  # exits. It is the only container that ever mounts the secret rw.
  #
  # NO NETWORK AT ALL, which is sigstore-bootstrap's line verbatim: "it
  # generates key material and writes files. Nothing it does requires reaching
  # anything, so nothing can reach it either." It is also worth #100's
  # arithmetic — this machine tops out at roughly twenty-nine Docker networks
  # and the three shipped stacks already hold twelve — that `network_mode:
  # none` costs ZERO of them.
  #
  # IDEMPOTENT. An existing secret is left alone; `down -v` is the only
  # rotation, exactly as for the Fulcio CA and the Rekor log key. See
  # innsegl/identity-init.sh for why a rotation is survivable (ADR-0041:
  # resolution goes through the ledger row, never the key) and still not
  # something to do on every boot.
  # --------------------------------------------------------------------------
  innsegl-identity-init:
    image: *openssl-image
    container_name: innsegl-identity-init
    network_mode: none
    entrypoint: ["/bin/sh"]
    command: ["/identity-init.sh"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    environment:
      # The path it writes. innsegl-mcp reads the same anchor.
      INNSEGL_IDENTITY_SECRET_FILE: *identity-secret-file
    volumes:
      - ./innsegl/identity-init.sh:/identity-init.sh:ro
      # THE ONLY rw MOUNT OF THIS VOLUME ANYWHERE IN THE STACK.
      - innsegl-identity-secret:/run/innsegl/identity

  # --------------------------------------------------------------------------
  # innsegl-admin-credential-init — #264's issuing side, as a one-shot.
  #
  # innsegl-identity-init's shape and for its reasons: it produces key material,
  # it needs to reach nothing to do that, so it reaches nothing
  # (`network_mode: none`), and it is the only container that mounts either of
  # these volumes read-write.
  #
  # IDEMPOTENT, AND ONE-DIRECTIONALLY SO. An existing signing key is LEFT
  # ALONE — regenerating one on every boot would refuse every credential an
  # operator had already minted, and `docker compose down -v` is the only way to
  # rotate it, exactly as for the pseudonymisation secret. Rotating deliberately
  # is `innsegl admin-credential keygen`, which ADDS a key to the set so both
  # verify during the overlap.
  #
  # IT RUNS EVEN WHEN THE SPLIT IS OFF, and does nothing: the two paths above
  # expand to nothing, and the script says so and exits. A conditional service
  # would be a second place the split's state is decided.
  # --------------------------------------------------------------------------
  innsegl-admin-credential-init:
    <<: *innsegl-build
    container_name: innsegl-admin-credential-init
    network_mode: none
    entrypoint: ["/bin/sh"]
    command: ["/admin-credential-init.sh"]
    restart: "no"
    read_only: true
    # root, so the key set can be chowned to the uid innsegl-mcp runs as. The
    # volume is created root-owned by Docker and the MCP must be able to read
    # it without this stack running the MCP as root.
    user: "0:0"
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    environment:
      # The paths it writes. innsegl-mcp reads the first from the same anchor.
      INNSEGL_MCP_ADMIN_JWKS_FILE: *admin-jwks-file
      INNSEGL_ADMIN_CREDENTIAL_KEY_FILE: *admin-key-file
    volumes:
      - ./innsegl/admin-credential-init.sh:/admin-credential-init.sh:ro
      # THE ONLY rw MOUNTS OF EITHER VOLUME ANYWHERE IN THE STACK.
      - innsegl-admin-jwks:/run/innsegl/admin
      - innsegl-admin-key:/run/innsegl/admin-key

  # --------------------------------------------------------------------------
  # innsegl-mcp — doc 05 §1's "The MCP server (register/credential/event/sign/
  # retire). Only service holding SPIRE admin credential."
  #
  # NETWORKS: four, and the list IS the access-control list.
  #   innsegl-ledger          the chain, as the append-only role
  #   innsegl-spire-admin     the admin API. DECLARED BY spire.yml WITH ONE
  #                           MEMBER precisely so that joining it is the whole
  #                           of what grants admin reachability. This is the
  #                           service it was declared for.
  #   innsegl-sigstore        fulcio and rekor
  #   innsegl-mcp-clients     the agents, and the only non-internal one
  #
  # It is on NO network with the object store, and none with the dashboard.
  #
  # ITS IDENTITY IS ATTESTED, not minted by hand. It mounts the Workload API
  # socket and nothing else from SPIRE, and `register.sh` creates the one entry
  # — spiffe://innsegl.dev/innsegl/mcp, server.conf's single admin_ids value —
  # whose five selectors it must match. deploy/compose/README.md used to record
  # a circularity here; register.sh's header explains why there is not one.
  #
  # THE DATABASE ROLE. `-require-append-only-role` is SET, which is the whole
  # of #109's resolution: cmd/innsegl already measured the role at start-up and
  # defaulted to warning because nothing created one. Something creates one
  # now, so the server refuses to start behind anything else.
  # --------------------------------------------------------------------------
  innsegl-mcp:
    <<: *innsegl-build
    container_name: innsegl-mcp
    restart: unless-stopped
    depends_on:
      innsegl-db-init:
        condition: service_completed_successfully
      # #124: without the secret this process REFUSES TO START — correctly, and
      # then crashloops. Gating on the one-shot's completion is what makes a
      # clean `docker compose up` need no manual step.
      innsegl-identity-init:
        condition: service_completed_successfully
      # #264: with the identity lifecycle on its own listener this process
      # REFUSES TO START without the key set that authenticates a caller on it.
      # Gating on the one-shot is what makes a clean `up` need no manual step.
      innsegl-admin-credential-init:
        condition: service_completed_successfully
    networks:
      - innsegl-ledger
      - innsegl-spire-admin
      - innsegl-sigstore
      - innsegl-mcp-clients
    labels:
      # The selector register.sh registers. Ours, not compose's own label
      # scheme, and part of the attestation surface rather than metadata.
      dev.innsegl.component: mcp
    # uid 1000 — the image's user and `unix:uid:1000`, one of the five
    # selectors. Not uid 0: agent.conf calls unix:uid:0 the textbook weak
    # selector, because every container runs as root by default.
    user: "1000:1000"
    # The image has no default subcommand — see the Dockerfile on why a default
    # would make one of the five rows the silent case.
    command: ["serve"]
    environment:
      INNSEGL_LEDGER_DSN: postgres://innsegl_appender:${INNSEGL_LEDGER_APPENDER_PASSWORD:-innsegl-compose-appender}@postgres:5432/innsegl?sslmode=disable
      # #109: refuse to start on an over-privileged role rather than warn.
      INNSEGL_REQUIRE_APPEND_ONLY_ROLE: "1"
      # innsegl-db-init migrated, as the owner. The MCP's own role has no DDL
      # rights at all, which is exactly the posture doc 05 §1 asks for.
      INNSEGL_MIGRATE: "0"

      INNSEGL_SPIRE_ADDRESS: spire-server:8081
      INNSEGL_TRUST_DOMAIN: *trust-domain
      INNSEGL_SPIRE_PARENT_ID: *parent-id
      INNSEGL_WORKLOAD_API_ADDRESS: unix:///run/spire/agent-sockets/api.sock

      INNSEGL_FULCIO_URL: *fulcio-url
      INNSEGL_REKOR_URL: *rekor-url
      INNSEGL_SPIRE_JWT_ISSUER: *jwt-issuer

      INNSEGL_MCP_LISTEN: 0.0.0.0:8080
      INNSEGL_MCP_HEALTH_LISTEN: 0.0.0.0:8081
      # #170. Empty serves all five tools on 8080, which is what every
      # deployment did before it and what this one still does by default.
      #
      # Set it to 0.0.0.0:8090 and register_agent and retire_agent move to that
      # listener, leaving 8080 the three tools that need a run_id someone else
      # issued. Something must be arranged to do the registering — a harness
      # hook (#171), or an operator — because with the split on and nothing
      # registering, no run can be created at all.
      #
      # #266 ANSWERED THE OTHER HALF OF THAT WARNING. #264 put a credential in
      # front of the six lifecycle tools, and the two shipped callers presented
      # none: turning this on would have answered every registration with 401,
      # so no agent could register and no commit could be signed. Both now mint
      # one for the repository they are working in, from the private key below,
      # and only when this listener refuses a call.
      INNSEGL_MCP_ADMIN_LISTEN: ${INNSEGL_MCP_ADMIN_LISTEN:-}
      # #264. The PUBLIC key set whose repository-scoped credentials the
      # identity lifecycle admits — the path, and never a key. Read once at
      # start-up and never fetched, so this deployment gains no dependency on
      # whatever issues them: an already-minted credential keeps working and
      # signing is unaffected if the issuing side is gone.
      #
      # Empty exactly when the listener above is, and `serve` refuses either one
      # without the other. See the anchor.
      INNSEGL_MCP_ADMIN_JWKS_FILE: *admin-jwks-file

      # Companion subcommands to run inside this process (serve.go's -also).
      #
      # EMPTY BY DEFAULT, which is what every deployment did before this, and
      # the reason it is a variable at all is that the reaper had no way to run:
      # this file ships no reaper service, and nothing else started one. IP §6.7
      # requires orphaned identities to expire, and measured 2026-09-08 nothing
      # was expiring them — a subagent that dies without a clean stop left its
      # run Active forever, one of them for 13 hours while it kept collecting
      # tool calls.
      #
      # `make innsegl-up-here` sets this to `reap`. A deployment that wants the
      # sealer and reconciler in here too has innsegl.oneprocess.yml, which
      # states what folding them in costs.
      INNSEGL_MCP_ALSO: ${INNSEGL_MCP_ALSO:-}
      # HOW LONG SILENCE IS ALLOWED BEFORE IT IS CALLED ORPHANED. This was 5m
      # and 5m is not silence, it is a long tool call: PostToolUse fires when a
      # tool RETURNS, so a build, a test run or a slow network makes a perfectly
      # live agent look dead. Measured 2026-09-18 on this deployment, the first
      # sweep after the reaper was fixed expired run-f0ac88f8 at 07:17 and that
      # run was recording tool calls again at 07:20.
      #
      # `run_expired` is permanent and append-only (I4), so a grace that is too
      # short writes a false statement about a live agent into a chain that
      # cannot take it back. The code's own documented default is 12h and that
      # is what this now uses. The cost is the other direction — a genuinely
      # dead run holds its SPIRE entry for up to 12h — and that is the cheaper
      # mistake: an idle entry is untidy, a false expiry is a lie in the record.
      INNSEGL_REAP_GRACE: ${INNSEGL_REAP_GRACE:-12h}

      # HOW OFTEN THE COMPANION SWEEPS. `reap` sweeps once and exits unless it is
      # given an interval, and as a companion that meant one sweep per container
      # start: measured 2026-09-18, one sweep in 34 hours and about fifty runs
      # standing Active with their agents long gone. Unset leaves the CLI's
      # one-shot default for anyone running `innsegl reap` by hand; the companion
      # needs a number, and it needs to be well under the grace, or an orphan
      # waits a whole interval past its deadline.
      INNSEGL_REAP_INTERVAL: ${INNSEGL_REAP_INTERVAL:-1m}

      # The PATH to this deployment's secret, not the secret. See the anchor.
      # `-identity-mode` is left at its default, `pseudonymous`: the SPIFFE ID,
      # the Fulcio certificate, the Rekor entry and the `Agent-Identity` trailer
      # carry a keyed pseudonym of agent_type and task_ref rather than the
      # caller's ticket reference (ADR-0041). An operator who wants the literal
      # values sets INNSEGL_IDENTITY_MODE=literal deliberately and removes this.
      INNSEGL_IDENTITY_SECRET_FILE: *identity-secret-file

      INNSEGL_WORKSPACE: /work
      # THE AUTHOR NAMES THE DEPLOYMENT, NOT THE AGENT.
      #
      # Which agent did the work is in the Agent-Identity trailer and in the
      # certificate, per run. The author is fixed when this file is read, so it
      # cannot name a run and must not try: two places claiming to say who did
      # something, one of them stale, is worse than one.
      #
      # It said "Innsegl Demo Agent" until 2026-09-08 and that was a bad
      # default -- it put the word "Demo" into the history of every deployment
      # that never changed it, including real ones. test/smoke sets its own,
      # because that one IS a demo.
      INNSEGL_SIGN_AUTHOR_NAME: ${INNSEGL_SIGN_AUTHOR_NAME:-Innsegl}
      # THE .invalid DOMAIN IS NOT DECORATION AND MUST NOT BE CHANGED TO A REAL
      # ONE. It is how I6 holds: "No GitHub contributor is ever added."
      #
      # GitHub creates a contributor by resolving a commit's author address to
      # an account. `.invalid` is reserved by RFC 2606 and can never be
      # delegated, so there is no account to resolve to and no contributor
      # appears -- for an agent that never consented to being one, and cannot.
      #
      # I6's author gate refuses such an address unless told to admit it, which
      # is what INNSEGL_SIGN_AUTHOR_ALLOW_UNLINKED below does. Setting a real
      # address here would put an agent's work under a person's name.
      INNSEGL_SIGN_AUTHOR_EMAIL: ${INNSEGL_SIGN_AUTHOR_EMAIL:-agent@innsegl.invalid}
      INNSEGL_SIGN_AUTHOR_ALLOW_UNLINKED: ${INNSEGL_SIGN_AUTHOR_ALLOW_UNLINKED:-true}
    volumes:
      # The Workload API socket, from spire.yml's project. Read-write because
      # a Unix socket is connected to, not read.
      - spire-agent-socket:/run/spire/agent-sockets
      # The working trees `repo` resolves under, shared with the reconciler
      # (which re-checks intents against them) and with demo-agent (which
      # stages into them).
      - innsegl-workspace:/work
      # READ-ONLY, and the only other mount of this volume is
      # innsegl-identity-init's rw one. One writer, one reader — the control the
      # Fulcio CA key and the Rekor log key have.
      - innsegl-identity-secret:/run/innsegl/identity:ro
      # READ-ONLY, and PUBLIC halves only (E8). The signing key lives on a
      # volume this service does not mount at all: a process that could read it
      # could mint its own admission to the listener it is being protected by.
      - innsegl-admin-jwks:/run/innsegl/admin:ro
    ports:
      # Loopback only, like every other published port in this deployment.
      #
      # 28080 and not 8080 on the HOST side. The container keeps 8080 — inside
      # its own network nothing else is there — but a published 8080 is a
      # default that collides with almost every development server there is,
      # and the failure it produces is a bind error during bring-up that names
      # a port rather than a cause. This deployment has already been bitten by
      # exactly that on 3000 (#131): a foreign container answered a probe and
      # the harness read the reply as a fault in our own Rekor.
      #
      # 28080/28081 keep the mnemonic and sit below both Linux's ephemeral
      # range (32768+) and macOS's (49152+), so the kernel will not hand the
      # same number to something else mid-bring-up — the race RM-092 (#143)
      # measured and fixed on the test side.
      - "127.0.0.1:${INNSEGL_MCP_PORT:-28080}:8080"
      - "127.0.0.1:${INNSEGL_MCP_HEALTH_PORT:-28081}:8081"
      # #170's identity lifecycle. Published only when INNSEGL_MCP_ADMIN_LISTEN
      # is set on the service below; the mapping is harmless when it is not,
      # because nothing is listening on 8090 in that case.
      #
      # WHAT THIS SEPARATION IS, AND WHAT IT IS NOT. It closes the leak for a
      # client that speaks only to the address it was configured with: an MCP
      # client pointed at 28080 has no register_agent to call, so the model
      # driving it cannot mint an identity for itself.
      #
      # It does NOT constrain a model holding a shell on this host. Loopback is
      # reachable from anything running here, so a model that decides to curl
      # 28090 will reach it. On a single-user laptop this is a convention with
      # a mechanism behind it, not a boundary. It becomes a boundary when the
      # model and the harness are on different hosts — which is the deployment
      # #68 contemplates, and the reason this is worth wiring now rather than
      # after.
      - "127.0.0.1:${INNSEGL_MCP_ADMIN_PORT:-28090}:8090"
    healthcheck:
      # /readyz and not a TCP dial: ADR-0024's rule, that a readiness probe
      # must fetch something it can parse. An unexamined 200 passes against any
      # listening socket, including a proxy in front of a dead server.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8081/readyz >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # --------------------------------------------------------------------------
  # innsegl-init — RM-097 (#156), option 2 of that issue: run `innsegl init`
  # AS the deployment, on innsegl-spire-admin, instead of reaching it from the
  # host. NOT A DOC 05 §1 ROW — a job, the same shape as demo-agent and
  # innsegl-canary above: it runs once, under a profile, and exits.
  #
  # REUSES innsegl-mcp's image, uid and dev.innsegl.component LABEL ON
  # PURPOSE. Those five properties are exactly the selectors register.sh's
  # bootstrap entry matches (spiffe://innsegl.dev/innsegl/mcp, server.conf's
  # only admin_ids value) — see register_mcp() there. So this container
  # attests as the SAME identity the running innsegl-mcp holds; no second
  # admin identity is registered and neither server.conf nor
  # authz-policy.rego changes. cmd/innsegl/initsignharness_test.go's own
  # comment on signE2EAdminID calls this "the right impersonation, not a
  # shortcut": `init`'s admin credential is meant to resolve exactly like
  # `serve`'s, and this is that, run inside the deployment instead of a test
  # harness minting the same identity by hand.
  #
  # WHAT IT DOES NOT NEED: no published port, ever — `docker compose run` has
  # nothing to publish and nothing to forget to unpublish. Two networks only,
  # both already declared for innsegl-mcp: the admin path and Fulcio/Rekor.
  # No route to postgres, the object store, or the dashboard.
  #
  # THE COST, MEASURED (see runbooks/spire-admin-access.md for the full
  # account): the repository `init` sets up is passed in as a HOST BIND MOUNT
  # at run time (`-v <path>:/target`), which is new to this compose stack —
  # every other mount here is a named volume. A repository whose files are not
  # owned by uid 1000, or that git will not treat as safe across that uid
  # boundary, needs the operator's own `git config --global --add
  # safe.directory` first; this file cannot fix that from the inside. And
  # `-gitsign-path` must be passed explicitly — the image already carries a
  # verified gitsign at /usr/local/bin/gitsign (see ../../Dockerfile), but
  # this network has no route to GitHub for `init` to fall back to its own
  # download-and-verify path, so the flag is not optional here the way it is
  # on the host.
  #
  #   docker compose -f deploy/compose/innsegl.yml --profile init run --rm \
  #     -v "$(pwd)":/target innsegl-init \
  #     init -repo /target -trust-root self-hosted -gitsign-path /usr/local/bin/gitsign \
  #     -non-interactive -identity-mode pseudonymous
  # --------------------------------------------------------------------------
  innsegl-init:
    profiles: ["init"]
    <<: *innsegl-build
    container_name: innsegl-init
    networks:
      - innsegl-spire-admin
      - innsegl-sigstore
    labels:
      dev.innsegl.component: mcp
    user: "1000:1000"
    environment:
      INNSEGL_SPIRE_ADDRESS: spire-server:8081
      INNSEGL_TRUST_DOMAIN: *trust-domain
      INNSEGL_FULCIO_URL: *fulcio-url
      INNSEGL_REKOR_URL: *rekor-url
      # init.go's flag is -oidc-issuer, but its env fallback is the SAME
      # variable server.conf and every other service in this file already
      # read (envOIDCIssuer == "INNSEGL_SPIRE_JWT_ISSUER") — one issuer, one
      # name, everywhere it is read. Not *jwt-issuer's own anchor: that one is
      # `:?required`, and this service must still give a clear "-oidc-issuer
      # is required" refusal rather than compose's own missing-variable error
      # if an operator invokes it before exporting the variable at all.
      INNSEGL_SPIRE_JWT_ISSUER: ${INNSEGL_SPIRE_JWT_ISSUER:-}
    volumes:
      - spire-agent-socket:/run/spire/agent-sockets
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # --------------------------------------------------------------------------
  # innsegl-reconciler — doc 05 §1's "Intent expiry, Rekor cross-check, drift
  # detection", from the same binary under another subcommand.
  #
  # doc 05 §2 runs it SINGLE-ACTIVE via leader election. Compose has one
  # replica and therefore needs none; the property that makes failover safe is
  # REC-005's idempotence, not the election, and it holds here too.
  #
  # #153/RM-096 gave `reconcile` a SECOND pass: internal/spire.Reconciler,
  # comparing SPIRE's registration entries against the ledger's record of
  # them (AB-11, RM-019, SPI-008), which previously had no caller anywhere
  # this binary reached. It is one command, one schedule, one thing to
  # deploy — no new row here — and it is OFF by default (-spire-address
  # empty), reported as off on every cycle rather than silently skipped.
  #
  # IT IS STILL OFF HERE, DELIBERATELY, and this is a topology question
  # reported rather than settled by this wiring:
  #
  #   * server.conf's admin_ids names exactly one identity,
  #     spiffe://innsegl.dev/innsegl/mcp, matched by register.sh's five
  #     selectors for the innsegl-mcp CONTAINER specifically (one of them is
  #     docker:label:dev.innsegl.component:mcp — this service's label is
  #     "reconciler", so it cannot match that entry).
  #   * doc 05 §1 states, for that row, "Only service holding SPIRE admin
  #     credential". Turning this pass on for a second, separately-labelled
  #     container needs a decision this file cannot make on its own: register
  #     a second, narrowly-scoped admin identity for the reconciler (a
  #     register.sh addition, an admin_ids entry, and — since
  #     authz-policy.rego authorizes an admin identity for its whole method
  #     set rather than per-identity — either accepting that this container
  #     then also holds BatchCreateEntry/BatchDeleteEntry/MintJWTSVID, or
  #     extending the policy to scope methods per admin identity) or issue it
  #     the SAME mcp identity (two containers presenting one credential).
  #     Either is a threat-model change (ADR-0011/ADR-0012's territory), not
  #     a wiring one, and #153 leaves it to the maintainer rather than
  #     deciding it here. See the pull request for the full writeup.
  #
  # An operator who HAS made that decision turns this pass on with three
  # variables — INNSEGL_SPIRE_ADDRESS (host:port), INNSEGL_TRUST_DOMAIN
  # (already set below), and INNSEGL_WORKLOAD_API_ADDRESS (defaults to the
  # same socket innsegl-mcp reads) — plus this service joining
  # innsegl-spire-admin and mounting spire-agent-socket the way innsegl-mcp
  # does. None of that is done here while the identity question stands.
  # --------------------------------------------------------------------------
  innsegl-reconciler:
    <<: *innsegl-build
    container_name: innsegl-reconciler
    restart: unless-stopped
    depends_on:
      innsegl-db-init:
        condition: service_completed_successfully
    networks:
      - innsegl-ledger
      - innsegl-sigstore
    labels:
      dev.innsegl.component: reconciler
    user: "1000:1000"
    command: ["reconcile"]
    environment:
      INNSEGL_LEDGER_DSN: postgres://innsegl_appender:${INNSEGL_LEDGER_APPENDER_PASSWORD:-innsegl-compose-appender}@postgres:5432/innsegl?sslmode=disable
      INNSEGL_REKOR_URL: *rekor-url
      INNSEGL_TRUST_DOMAIN: *trust-domain
      INNSEGL_WORKSPACE: /work
      INNSEGL_RECONCILE_INTERVAL: ${INNSEGL_RECONCILE_INTERVAL:-1m}
      INNSEGL_RECONCILE_EXPIRE_AFTER: ${INNSEGL_RECONCILE_EXPIRE_AFTER:-10m}
      # ADR-0047 decision 4: record a rewritten commit's new SHA as a
      # SUPERSEDING commit_recorded, so lookup by SHA keeps working after a
      # merge. OFF unless BOTH are set, and off is the compose default because
      # this pass reads repositories and writes to the chain — a deployment
      # opts into that deliberately.
      #
      # Set them to the branch merges land on and the repositories to walk:
      #
      #   INNSEGL_REBASE_BRANCH=main
      #   INNSEGL_REBASE_REPOS=github.com/<org>/<name>,github.com/<org>/<other>
      #
      # The repositories must be reachable under /work, which is what
      # `make innsegl-link` puts there.
      INNSEGL_REBASE_BRANCH: ${INNSEGL_REBASE_BRANCH:-}
      INNSEGL_REBASE_REPOS: ${INNSEGL_REBASE_REPOS:-}
      # RM-104 (#169). The harness's retained tool-call bodies, READ-ONLY.
      # With it, the content a run REPORTS writing is checked against the trees
      # it SIGNED, so a reported write becomes falsifiable; without it
      # `payload_digest` is compared to nothing and the ledger records what the
      # caller said it did.
      #
      # OFF unless set, and off is the compose default because these bodies are
      # the operator's own file contents and commands: a deployment opts into
      # reading them deliberately. The repositories checked are the ones
      # INNSEGL_REBASE_REPOS already names.
      INNSEGL_WRITES_LOG_DIR: ${INNSEGL_WRITES_LOG_DIR:-}
      INNSEGL_WRITES_REPOS: ${INNSEGL_WRITES_REPOS:-}
    volumes:
      - innsegl-workspace:/work
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # --------------------------------------------------------------------------
  # innsegl-sealer — doc 05 §1's "Segment sealing + anchoring".
  #
  # ================= WHERE THESE SETTINGS CAME FROM =======================
  # `innsegl seal`'s operator surface is #112's, written in parallel with this
  # file. When this service was first written `innsegl seal` still printed
  # "not implemented", so nothing here was read off the implementation: it is
  # the most defensible reading of the conventions the two already-wired
  # background subcommands set —
  #
  #   from `reconcile`  -dsn/$INNSEGL_LEDGER_DSN, -rekor-url/$INNSEGL_REKOR_URL,
  #                     -interval, -once, -json, -quiet
  #   from `canary`     the whole $INNSEGL_OBJECT_STORE_* family — endpoint,
  #                     bucket, access-key, secret-key, region, prefix, tls,
  #                     retention-mode, retention, timeout
  #
  # — and it passes only environment variables, no flags.
  #
  # CONFIRMED against #112's landed cmd/innsegl/seal.go: every variable below
  # is one it reads, with the spelling above. It adds four of its own, of which
  # this file sets one ($INNSEGL_SEAL_INTERVAL); the other three
  # ($INNSEGL_SEAL_SEGMENT_EVENTS, $INNSEGL_SEAL_MAX_SEGMENT_AGE,
  # $INNSEGL_SEAL_SCAN_WINDOW) keep their defaults, which are doc 05 §4's
  # sizing rather than anything this file should second-guess.
  #
  # $INNSEGL_ANCHOR_KEY is deliberately NOT set. Empty generates an ephemeral
  # anchoring key per process, which is right for a compose stack whose whole
  # trust root is regenerated by `down -v`; a deployment that wants its
  # anchoring identity to outlive a restart mounts a PEM and sets it.
  # ========================================================================
  #
  # doc 05 §2 runs it single-active; SEG-002's idempotence is what makes a
  # double-run harmless, and compose has one replica in any case.
  # --------------------------------------------------------------------------
  # --------------------------------------------------------------------------
  # innsegl-backup — the ledger backup, ON THE SCHEDULE THE DEPLOYMENT KEEPS
  # (RM-146, #237).
  #
  # WHAT THIS REPLACES. The backup ran from a HOST scheduler: launchd on one
  # platform, systemd on the other, two unit layouts, and a scheduler that has
  # to exist at all. It reached the ledger and the object store through the
  # container runtime — ten `docker exec`, two `docker cp` and a `docker run`.
  #
  # SO IT HOLDS NO RUNTIME SOCKET, and that is the point rather than a detail:
  # a process holding it is root on the host, which is not a trade a backup may
  # make. There is no /var/run/docker.sock below and there must never be one;
  # OPS-044 attempts the call and requires the refusal.
  #
  # ON BOTH LEDGER AND OBJECT NETWORKS, because the job is both halves: dump
  # the ledger, and adjudicate the dump against the sealed segments. It is on
  # neither the Filer's network nor the volume server's — those have one route
  # in and it is the gateway (doc 05 §1).
  #
  # THE CREDENTIALS IT HOLDS ARE BOTH READERS. innsegl_backup can read the
  # ledger and own throwaway databases and cannot write the ledger
  # (verify-backup-role.sh, OPS-043); the object identity needs GetObject and
  # ListBucket under the segment prefix, and nothing on this store can delete a
  # retained segment in any case.
  #
  # THE HEALTHCHECK IS THE READINESS THIS DESIGN OWES. Running only while the
  # stack is up makes the backup's liveness the stack's liveness, so a stack
  # that was down for three days has a three-day-old backup; backup-health.sh
  # says so rather than leaving it to be assumed.
  # --------------------------------------------------------------------------
  innsegl-backup:
    image: ${INNSEGL_BACKUP_IMAGE:-innsegl-backup:local}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: backup
    container_name: innsegl-backup
    restart: unless-stopped
    depends_on:
      innsegl-db-init:
        condition: service_completed_successfully
    networks:
      - innsegl-ledger
      - innsegl-objects
    labels:
      dev.innsegl.component: backup
    user: "1000:1000"
    entrypoint: ["/innsegl/init/backup-loop.sh"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: *ledger-database
      INNSEGL_BACKUP_ROLE: *backup-role
      INNSEGL_BACKUP_PASSWORD: *backup-password
      INNSEGL_BACKUP_SCRIPT: /innsegl/scripts/backup-ledger.sh
      INNSEGL_BACKUP_DIR: /backups
      INNSEGL_BACKUP_MARKER: /backups/.last-run
      # Daily, and a window of twice that: one slow or skipped run is not an
      # alert, two in a row are. An alert that fires on ordinary jitter is one
      # an operator learns to ignore.
      INNSEGL_BACKUP_INTERVAL: ${INNSEGL_BACKUP_INTERVAL:-86400}
      INNSEGL_BACKUP_WINDOW: ${INNSEGL_BACKUP_WINDOW:-172800}
      # The segment half. The same gateway the sealer writes through, read with
      # an identity that can only read.
      INNSEGL_OBJECT_STORE_REGION: ${INNSEGL_OBJECT_STORE_REGION:-us-east-1}
    command:
      - --object-store-endpoint
      - innsegl-s3:8333
      - --object-store-bucket
      - *object-store-bucket
      - --object-store-prefix
      - *object-store-prefix
      - --object-store-access-key
      - *object-store-sealer-user
      - --object-store-secret-key
      - *object-store-sealer-password
    healthcheck:
      test: ["CMD", "/innsegl/init/backup-health.sh"]
      interval: 60s
      timeout: 15s
      retries: 3
      # A backup takes as long as it takes, and the first one runs at start-up.
      # A start period shorter than that reports unhealthy while the very first
      # backup is still being written.
      start_period: 300s
    volumes:
      - ./innsegl:/innsegl/init:ro
      # The script and the gate it adjudicates with, read straight from the
      # repository for the reason the migrations are: a copy is a thing that
      # drifts. backup-ledger.sh resolves its gate relative to its own parent,
      # so these two paths are what make /innsegl the repository root it sees.
      - ../../scripts:/innsegl/scripts:ro
      - ../../runbooks:/innsegl/runbooks:ro
      - innsegl-backups:/backups

  innsegl-sealer:
    <<: *innsegl-build
    container_name: innsegl-sealer
    restart: unless-stopped
    depends_on:
      innsegl-db-init:
        condition: service_completed_successfully
      innsegl-object-init:
        condition: service_completed_successfully
    networks:
      - innsegl-ledger
      - innsegl-objects
      - innsegl-sigstore
    labels:
      dev.innsegl.component: sealer
    user: "1000:1000"
    command: ["seal"]
    environment:
      INNSEGL_LEDGER_DSN: postgres://innsegl_appender:${INNSEGL_LEDGER_APPENDER_PASSWORD:-innsegl-compose-appender}@postgres:5432/innsegl?sslmode=disable
      INNSEGL_REKOR_URL: *rekor-url
      INNSEGL_OBJECT_STORE_ENDPOINT: innsegl-s3:8333
      INNSEGL_OBJECT_STORE_BUCKET: *object-store-bucket
      # THE SCOPED IDENTITY, NOT THE STORE'S ROOT ACCOUNT (#228). See the
      # anchor declaration at the head of this file for what it may do and for
      # the two permissions withheld from it by name.
      INNSEGL_OBJECT_STORE_ACCESS_KEY: *object-store-sealer-user
      INNSEGL_OBJECT_STORE_SECRET_KEY: *object-store-sealer-password
      # Plain HTTP to a gateway on an internal network with four members. A
      # deployment whose object store is off-box sets this to true and gets a
      # trust store from the image's ca-certificates.
      INNSEGL_OBJECT_STORE_TLS: "false"
      INNSEGL_OBJECT_STORE_PREFIX: *object-store-prefix
      INNSEGL_OBJECT_STORE_RETENTION_MODE: ${INNSEGL_OBJECT_STORE_RETENTION_MODE:-COMPLIANCE}
      INNSEGL_SEAL_INTERVAL: ${INNSEGL_SEAL_INTERVAL:-1m}
      # NO $INNSEGL_OBJECT_STORE_RETENTION HERE, AND THAT IS THE FIX RATHER
      # THAN AN OMISSION. Found by #112's review of this file:
      #
      #   cmd/innsegl parses it as a GO DURATION (time.ParseDuration).
      #   innsegl/object-init.sh parses it as a COUNT OF DAYS — `1d`, `30d` —
      #   because that is the only unit S3's default retention rule has.
      #   Go has no `d` unit. time.ParseDuration("1d") is `unknown unit "d"`,
      #   and cmd/innsegl's envDuration falls back to its default WITHOUT AN
      #   ERROR.
      #
      # The default is 0, which means "inherit the bucket rule" — so a value
      # like `7d` set here would be silently ignored and the bucket default
      # used instead. Two grammars for one value, and the wrong one failing
      # quietly, is worse than no setting.
      #
      # So the bucket rule is the single source: object-init sets it once, at
      # creation, under $INNSEGL_OBJECT_LOCK_RETENTION, and the sealer inherits
      # it. A deployment that wants a per-object window longer than the
      # bucket's sets $INNSEGL_OBJECT_STORE_RETENTION itself, in GO's grammar
      # (`24h`, not `1d`).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # --------------------------------------------------------------------------
  # innsegl-api — the OTHER HALF of doc 05 §1's innsegl-dashboard row: "Read-only
  # UI + BFF proof checks. No write credentials mounted — enforced by giving it a
  # read-only DB role."
  #
  # #109 shipped the UI half alone and said why: no `main` in this module
  # constructed an `api.Server`, so there was nothing to containerise, and the
  # stack provisioned no read-only role for one to hold. #121 landed
  # `innsegl api`. This service is the wire between them.
  #
  # THE DSN IS $INNSEGL_API_DSN AND IT NAMES THE READER. Not $INNSEGL_LEDGER_DSN,
  # which every other innsegl-* service above sets and which names the APPENDER.
  # cmd/innsegl/api.go chose two names on purpose: "One name for two different
  # roles is a deployment that can hand the dashboard the writer by copying a
  # line." Handed the appender this process exits 13 WRITABLE and publishes no
  # address — measured, and there is no flag that turns the check off.
  #
  # IT HOLDS NO AUTHENTICATION. It authenticates nobody and authorises nothing;
  # doc 05 §3 puts dashboard.innsegl.dev behind Cloudflare Access and RM-062
  # (#70) is the issue that does it. Nothing here invents a scheme in the
  # meantime. What this arrangement does enforce is the half that survives a
  # misconfigured proxy: the credential cannot write, whoever reaches it. The
  # service publishes no host port for the same reason — the dashboard's nginx
  # is the only thing that reaches it, over the read-only network.
  #
  # NETWORKS: two, and it costs the deployment NO NEW ONE.
  #   innsegl-ledger-readonly  postgres, as the reader. This is the network doc
  #                            05 §1 asked for and #109 declared in advance with
  #                            two members and a note saying what it was waiting
  #                            for. It is also how innsegl-dashboard's nginx
  #                            reaches this service: both are already members,
  #                            and #100 caps this machine at roughly twenty-nine
  #                            networks, so a hop that can cost zero costs zero.
  #   innsegl-sigstore         fulcio and rekor, for the proof BFF's live checks.
  #
  # It is on NO network with the MCP, none with the object store, and none with
  # SPIRE.
  #
  # THE WORKSPACE IS MOUNTED READ-ONLY. The proof BFF reads commit objects out
  # of the working tree with git plumbing; `make innsegl-verify-commit` mounts
  # the same volume the same way. A read-only mount is not the control — the
  # database role is — but a BFF that could write into the tree it verifies
  # would be answering questions about its own output.
  #
  # THIS API HAS NO AUTHENTICATION, AND MUST NOT BE PUBLISHED DIRECTLY (#174).
  #
  # It answers every caller. That is safe here only because it publishes no
  # host port: the dashboard reaches it over this network and nothing else can.
  # Publish 8082, or put the dashboard on a public address, and the whole
  # ledger is world-readable -- agent_type and task_ref IN CLEAR, every run's
  # timeline, every payload digest, every repository signed in and when.
  #
  # ADR-0041's pseudonymisation does not help here and it is easy to think it
  # does. It protects the SPIFFE ID that reaches the PUBLIC LOG --
  # `cb590b02/e7cbb3a9` rather than `orchestrator/RM-101`. The ledger is where
  # those pseudonyms are RESOLVED, and resolving them is what this API is for.
  # The two surfaces have opposite properties:
  #
  #   Rekor    publishes pseudonyms      safe to expose (ADR-0042)
  #   this     publishes the resolution  not
  #
  # If you need it reachable from elsewhere, put your own authenticating proxy
  # in front of it. This project deliberately ships no token check: an
  # authentication mechanism nobody has threat-modelled looks like a control
  # and is not one, and saying plainly what the software does is worth more
  # than a header comparison.
  # --------------------------------------------------------------------------
  innsegl-api:
    <<: *innsegl-build
    container_name: innsegl-api
    restart: unless-stopped
    depends_on:
      innsegl-db-init:
        condition: service_completed_successfully
    networks:
      - innsegl-ledger-readonly
      - innsegl-sigstore
    labels:
      dev.innsegl.component: api
    user: "1000:1000"
    command: ["api"]
    environment:
      # THE READER. Compare the three services above, which set
      # $INNSEGL_LEDGER_DSN and name innsegl_appender; this one must not, and
      # `innsegl api` would refuse to serve if it did.
      INNSEGL_API_DSN: postgres://innsegl_reader:${INNSEGL_LEDGER_READER_PASSWORD:-innsegl-compose-reader}@postgres:5432/innsegl?sslmode=disable
      # 0.0.0.0 rather than the loopback default: the caller is the dashboard's
      # nginx, in another container. The service publishes no host port, and
      # BOTH its networks are internal — a container attached only to internal
      # networks cannot have a port published at all (measured; see
      # sigstore.yml's innsegl-sigstore-published) — so this listener is
      # reachable from postgres, innsegl-dashboard, fulcio and rekor, and from
      # nothing else in the deployment or on the host.
      INNSEGL_API_LISTEN: 0.0.0.0:8082
      # doc 02 §5 spells a repo as an IDENTIFIER; the MCP resolves it beneath
      # its workspace root, so the pair is <identifier>=<root>/<identifier>.
      # OVERRIDE THIS TOGETHER WITH $INNSEGL_DEMO_REPO: a proof request naming a
      # repository this list does not carry is a 404, which reads as a verdict
      # about the commit and is a statement about the configuration.
      INNSEGL_API_REPOS: ${INNSEGL_API_REPOS:-github.com/innsegl-demo/scratch=/work/github.com/innsegl-demo/scratch}
      # The same Sigstore a stranger is handed. doc 04 §5.4: a divergent
      # verifier is a divergence in what "verified" means, so the proof BFF runs
      # internal/verify against the endpoints `innsegl verify` uses.
      INNSEGL_FULCIO_URL: *fulcio-url
      INNSEGL_REKOR_URL: *rekor-url
      INNSEGL_OIDC_ISSUER: *jwt-issuer
    volumes:
      - innsegl-workspace:/work:ro
    healthcheck:
      # /api/v1/health and not a TCP dial: ADR-0024's rule, that a readiness
      # probe must fetch something it can parse. The body it returns is the
      # read-only report api.Open measured on the server — role, superuser,
      # default_transaction_read_only and every write probe with its SQLSTATE —
      # so "no write credentials mounted" is a fact an operator reads back
      # rather than a claim in a compose comment.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8082/api/v1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # --------------------------------------------------------------------------
  # innsegl-dashboard — doc 05 §1's "Read-only UI + BFF proof checks. No write
  # credentials mounted — enforced by giving it a read-only DB role."
  #
  # THIS IS THE UI HALF. innsegl-api above is the other one, and until it landed
  # this service held no database credential at all and every view that read the
  # query API rendered its own load-failure state, permanently (#109, #121).
  #
  # THE DASHBOARD STILL HOLDS NO DATABASE CREDENTIAL, and that is the point
  # rather than a leftover. The image is nginx and a built React bundle; the
  # credential lives one container away, in innsegl-api, where it is a role the
  # server itself certifies cannot write. doc 05 §1's "No write credentials
  # mounted — enforced by giving it a read-only DB role" is satisfied by both
  # halves at once: nothing is mounted here, and what is mounted next door is
  # read-only by ACL rather than by convention.
  #
  # web/ fetches `/api/v1/...` SAME-ORIGIN — see web/src/views/overview/data.ts,
  # where DEFAULT_API_BASE is the relative "/api/v1" — so the image's nginx
  # proxies that prefix to innsegl-api over innsegl-ledger-readonly. There is no
  # CORS anywhere in internal/api and none is invented here.
  # deploy/docker/dashboard-nginx.conf carries the block and the reason it
  # resolves the upstream at request time rather than at start-up.
  #
  # NETWORKS: doc 05 §1 puts the dashboard "on a network with read-only DB role
  # and the proof endpoints", so it joins innsegl-ledger-readonly (which is now
  # where the read-only credential is actually used, and where the WRITE
  # network's five members are not) and innsegl-sigstore (fulcio and rekor). It
  # is on NO network with the MCP.
  # --------------------------------------------------------------------------
  innsegl-dashboard:
    image: ${INNSEGL_DASHBOARD_IMAGE:-innsegl-dashboard:local}
    build:
      context: ../..
      dockerfile: deploy/docker/dashboard.Dockerfile
    container_name: innsegl-dashboard
    restart: unless-stopped
    # `service_started` and not `service_healthy`: the UI must come up and show
    # its own load-failure state if the backend is down, which is doc 06 §4.6's
    # requirement and what an operator needs to SEE. A dashboard that refuses to
    # start when its API is unhealthy would replace a visible failure with an
    # invisible one.
    depends_on:
      innsegl-api:
        condition: service_started
    networks:
      - innsegl-ledger-readonly
      - innsegl-sigstore
      - innsegl-dashboard-frontend
    labels:
      dev.innsegl.component: dashboard
    ports:
      - "127.0.0.1:${INNSEGL_DASHBOARD_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # --------------------------------------------------------------------------
  # demo-agent — doc 05 §1's "Scripted agent that registers, makes a
  # scratch-repo commit, retires."
  #
  # UNDER A PROFILE, because it is a job and not a service: it runs to
  # completion and exits, the way spire.yml's spire-verify-workload does. A
  # long-lived container that finished thirty seconds after `up` and shows as
  # `exited (0)` for the rest of the day is a worse first-run experience than a
  # command an operator runs when they want to watch it happen.
  #
  #   docker compose -f deploy/compose/innsegl.yml --profile demo run --rm demo-agent
  #
  # It holds NOTHING. No SPIRE socket, no database credential, no object store
  # key: one network with one other member, and an MCP address. Everything it
  # can do, it does by calling the four IP §4 tools by their published names —
  # which is the property that makes it a demonstration rather than a fixture.
  # --------------------------------------------------------------------------
  demo-agent:
    profiles: ["demo"]
    image: ${INNSEGL_DEMO_AGENT_IMAGE:-innsegl-demo-agent:local}
    build:
      context: ../..
      dockerfile: deploy/docker/demo-agent.Dockerfile
    container_name: innsegl-demo-agent
    depends_on:
      innsegl-mcp:
        condition: service_healthy
    networks:
      - innsegl-mcp-clients
    labels:
      dev.innsegl.component: demo-agent
    # The same uid as the MCP. Both write into one shared working tree, and two
    # uids on one tree is git's "dubious ownership" — which the signer cannot
    # work around, because it builds its child environment as a whitelist and
    # there is no safe.directory to inject.
    user: "1000:1000"
    environment:
      INNSEGL_MCP_URL: http://innsegl-mcp:8080
      INNSEGL_WORKSPACE: /work
      INNSEGL_DEMO_REPO: ${INNSEGL_DEMO_REPO:-github.com/innsegl-demo/scratch}
    volumes:
      - innsegl-workspace:/work
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # --------------------------------------------------------------------------
  # innsegl-canary — SEG-005's deletion canary, under a profile.
  #
  # Not a doc 05 §1 row, but doc 05 §2 requires it: "SEG-005's deletion canary
  # runs as a scheduled job in production, not only at deploy". A subcommand
  # whose exit status is the verdict serves both callers, and having it here
  # means the object-lock claim can be MEASURED on a first run rather than read:
  #
  #   docker compose -f deploy/compose/innsegl.yml --profile canary run --rm innsegl-canary
  # --------------------------------------------------------------------------
  innsegl-canary:
    profiles: ["canary"]
    <<: *innsegl-build
    container_name: innsegl-canary
    depends_on:
      innsegl-object-init:
        condition: service_completed_successfully
    networks:
      - innsegl-objects
    labels:
      dev.innsegl.component: canary
    user: "1000:1000"
    command: ["canary"]
    environment:
      INNSEGL_OBJECT_STORE_ENDPOINT: innsegl-s3:8333
      INNSEGL_OBJECT_STORE_BUCKET: *object-store-bucket
      # THE SCOPED IDENTITY, NOT THE STORE'S ROOT ACCOUNT (#228). See the
      # anchor declaration at the head of this file for what it may do and for
      # the two permissions withheld from it by name.
      INNSEGL_OBJECT_STORE_ACCESS_KEY: *object-store-sealer-user
      INNSEGL_OBJECT_STORE_SECRET_KEY: *object-store-sealer-password
      INNSEGL_OBJECT_STORE_TLS: "false"
      INNSEGL_OBJECT_STORE_RETENTION_MODE: ${INNSEGL_OBJECT_STORE_RETENTION_MODE:-COMPLIANCE}
      # No $INNSEGL_OBJECT_STORE_RETENTION, for the reason spelled out on the
      # sealer: `1d` is the bucket rule's grammar and not Go's. The canary's own default is
      # 0, which requires whatever retention the bucket rule gives the probe —
      # which is exactly the question SEG-005 asks.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

# ----------------------------------------------------------------------------
# Networks. doc 05 §1: "Network segmentation even in compose [...] Compose is
# where the least-privilege shape is first proven, not first ignored."
#
# The membership rule is written at each declaration, the way spire.yml and
# sigstore.yml write theirs. Five new networks; #100 — this machine tops out at
# roughly twenty-nine — so each one below has to earn its place, and one that
# would have (a dashboard/MCP shared frontend) is deliberately two.
# ----------------------------------------------------------------------------
networks:

  # THE WRITE PATH. doc 05 §1's "postgres write role reachable only from the
  # services that need them".
  # MEMBERS: postgres, innsegl-db-init, innsegl-mcp, innsegl-reconciler,
  # innsegl-sealer. Nothing else — in particular not the dashboard, which is
  # the point of the second ledger network below.
  innsegl-ledger:
    name: innsegl-ledger
    internal: true

  # THE READ PATH. doc 05 §1: "innsegl-dashboard on a network with read-only DB
  # role and the proof endpoints."
  # MEMBERS: postgres, innsegl-api, innsegl-dashboard. #109 declared this
  # network with two members and said what it was waiting for; innsegl-api is
  # the arrival. Two directions and no more: innsegl-api reaches postgres as
  # innsegl_reader — a credential api.Open proves read-only against the server
  # before it serves a request — and innsegl-dashboard's nginx reaches
  # innsegl-api. The WRITE network's five members are not here, and this
  # network is not a route to any of them.
  #
  # THE UI/BFF HOP RIDES THIS NETWORK RATHER THAN A SIXTH ONE, and that is a
  # decision rather than an omission: #100 caps this machine at roughly
  # twenty-nine networks, both containers are already members for reasons doc 05
  # §1 gives, and a separate network would buy no isolation the membership list
  # does not already describe — unlike the dashboard/MCP frontend split below,
  # which buys the one thing doc 05 §1's dashboard note forbids.
  innsegl-ledger-readonly:
    name: innsegl-ledger-readonly
    internal: true

  # THE S3 SURFACE. MEMBERS: innsegl-s3, innsegl-object-init, innsegl-sealer,
  # innsegl-canary. The MCP is deliberately not a member: sealing is the
  # sealer's, and an MCP that could write to the segment store could write a
  # segment nothing sealed.
  #
  # WHAT IS *NOT* HERE IS THE POINT (RM-143, #227): the Filer and the volume
  # server are not members. Object lock lives in the gateway; the Filer's own
  # API reaches the same bytes with no credential at all, and the volume
  # server's accepts unauthenticated deletes of raw needles. A member of this
  # network can reach neither. OPS-029 attempts it from here and requires the
  # attempt to find nothing.
  innsegl-objects:
    name: innsegl-objects
    internal: true

  # THE STORE'S INSIDES. MEMBERS: innsegl-object-store, innsegl-object-filer,
  # innsegl-s3. Three, and never a fourth — the gateway is the only member that
  # is also on innsegl-objects, which is the whole of what makes it the only
  # route in.
  #
  # IT COSTS ONE OF #100's ROUGHLY TWENTY-NINE NETWORKS and there was no way to
  # spend zero: the isolation being bought is between two containers that must
  # talk to each other and a third that must not reach either, which is exactly
  # what a second network is. The alternative — one process serving S3 and the
  # Filer on one bind address — is the arrangement that has no expressible
  # isolation at all.
  innsegl-object-backend:
    name: innsegl-object-backend
    internal: true

  # The agents' network, and the MCP's only non-internal one — a container on
  # internal networks alone CANNOT have a port published (measured, see
  # sigstore.yml), and the MCP is the service agents have to reach.
  # MEMBERS: innsegl-mcp, demo-agent, and whatever terminates TLS in front.
  innsegl-mcp-clients:
    name: innsegl-mcp-clients

  # The dashboard's public face. SEPARATE from innsegl-mcp-clients on purpose:
  # sharing one frontend network would give the dashboard a route to the MCP's
  # write surface, which is the one thing doc 05 §1's dashboard note forbids.
  # MEMBERS: innsegl-dashboard, and whatever terminates TLS in front.
  innsegl-dashboard-frontend:
    name: innsegl-dashboard-frontend

  # DECLARED IN spire.yml, JOINED HERE. spire.yml declared it with one member
  # and said why: "when innsegl-mcp arrives joining this network is the whole
  # of what grants it admin reachability". This is that arrival.
  # MEMBERS: spire-server, innsegl-mcp. Nothing else, ever.
  innsegl-spire-admin:
    name: ${INNSEGL_SPIRE_ADMIN_NETWORK:-innsegl-spire-admin}
    external: true

  # DECLARED IN sigstore.yml, JOINED HERE. Its own comment named the members it
  # was waiting for: "fulcio, rekor, and the innsegl-* services when they land
  # — the MCP, the sealer's anchorer, the reconciler's cross-check, the
  # dashboard's proof endpoints". All four have landed.
  innsegl-sigstore:
    name: ${INNSEGL_SIGSTORE_NETWORK:-innsegl-sigstore}
    external: true

# ----------------------------------------------------------------------------
# Volumes.
# ----------------------------------------------------------------------------
volumes:
  # The dumps and their verification reports (RM-146, #237).
  #
  # NOT one of doc 05 §2's irreplaceable four, and deliberately so: a backup is
  # a COPY, and the thing it is a copy of is on that list. Losing this volume
  # costs the backup history and nothing that cannot be taken again from the
  # ledger it was taken from — which is the opposite of the ledger's own case,
  # where "there is no rebuild-from-segments-alone".
  #
  # A deployment that wants these dumps off the box binds a host path here, or
  # copies them onward; doc 05 §2 names WORM object storage as the eventual
  # home, and this volume is the local default that works with no
  # configuration.
  # MOUNTED BY: innsegl-backup.
  innsegl-backups:

  # THE FOURTH OF THE IRREPLACEABLE FOUR (doc 05 §2; OPS-032).
  #
  # The ledger, and the reason it is on this list rather than the object
  # store: runbooks/index-rebuild.md §0 says "there is no
  # rebuild-from-segments-alone". A sealed segment ADJUDICATES a restore, it
  # does not supply one — the event bodies (agent_type, task_ref, run_id and
  # every tool_call) live here and nowhere else. On 2026-09-16 a `down -v`
  # took it from 19,595 chain positions to 60.
  #
  # Brought up through `make` this resolves to a volume declared OUTSIDE this
  # project, so `down -v` can only detach it. The default below reproduces
  # this project's own name exactly; see the same block in sigstore.yml.
  # MOUNTED BY: postgres.
  innsegl-ledger-data:
    name: ${INNSEGL_TRUST_LEDGER_VOLUME:-${COMPOSE_PROJECT_NAME:-innsegl-core}_innsegl-ledger-data}
    external: ${INNSEGL_TRUST_VOLUMES_EXTERNAL:-false}
  # Sealed segments' BYTES, under object lock. MOUNTED BY: innsegl-object-store.
  innsegl-object-data:

  # The store's metadata — which bucket, which key, which version, and which
  # retention. MOUNTED BY: innsegl-object-filer. Separate from the bytes because
  # they are separate processes; losing this volume leaves innsegl-object-data
  # full of segments addressable by nothing.
  innsegl-object-filer-data:

  # The gateway's identity file: the two S3 credentials and the scope of the
  # second one. MOUNTED BY: innsegl-s3-identities (rw) and innsegl-s3 (ro).
  # Nothing else, ever — a service that could read it holds the root credential,
  # and one that could write it holds the scope.
  innsegl-s3-identities:
  # The working trees `repo` resolves under (doc 02 §5: `repo` is an
  # identifier, and the tree it names is the DEPLOYMENT's, not the caller's).
  # MOUNTED BY: innsegl-mcp (rw), innsegl-reconciler (rw), demo-agent (rw).
  innsegl-workspace:

  # #264's PUBLIC key set: the keys whose repository-scoped credentials the
  # identity-lifecycle listener admits.
  # MOUNTED BY: innsegl-admin-credential-init (rw), innsegl-mcp (ro).
  innsegl-admin-jwks:

  # #264's PRIVATE signing key. MOUNTED BY: innsegl-admin-credential-init (rw)
  # and by NO SERVICE, ever — E8 keeps the MCP to public halves, and a service
  # that could read this could mint its own admission to the listener this key
  # exists to protect.
  #
  # #266 — WHO READS IT, AND HOW. The two callers that reach the identity
  # lifecycle — scripts/innsegl-commit.sh and scripts/hooks/subagent-identity.sh
  # — mint their own credential by running the shipped command in a THROWAWAY
  # container that mounts this volume read-only, has no network, no writable
  # root filesystem and no privilege escalation, and exits:
  #
  #   docker run --rm --network none --read-only --user 0:0 \
  #     --security-opt no-new-privileges \
  #     -v <project>_innsegl-admin-key:/k:ro <image> \
  #     admin-credential mint -key /k/signing.key -repo host/org/name
  #
  # `--user 0:0` because the one-shot leaves the key 0400 and root-owned, which
  # is the point: the image's own 1000:1000 cannot read it. A container rather
  # than a service is deliberate — a long-lived minter would be a standing mint
  # oracle for anything that could reach it, while one that exists for a fifth
  # of a second is reachable only through the Docker API, which already carried
  # the privilege to mount this volume. Nothing copies the key onto the host,
  # and the only value that crosses the boundary is the credential, on a pipe.
  #
  # The callers mint LAZILY, on a 401 and on nothing else, so a deployment with
  # INNSEGL_MCP_ADMIN_LISTEN unset never runs any of the above.
  #
  # Losing it costs the ability to issue NEW credentials and nothing else: the
  # public half stays in the key set, already-issued credentials keep verifying
  # until they expire, and a replacement is one `keygen` away.
  innsegl-admin-key:

  # THIS DEPLOYMENT's pseudonymisation secret, and the reason it is a volume
  # rather than a value in this file: a secret in the file would be the same
  # secret in every deployment (#124, ADR-0041).
  # MOUNTED BY: innsegl-identity-init (rw), innsegl-mcp (ro). Nothing else,
  # ever — the secret CREATES a pseudonym and is needed to resolve one never,
  # so no read path in this stack has any use for it.
  #
  # IRREPLACEABLE, and it took losing it to see why (doc 05 §2; OPS-032). A
  # `down -v` removed it, the deployment minted a new one, and the SAME task
  # string pseudonymised to a different id — so a run registered minutes
  # earlier could no longer claim a commit. Nothing already signed stopped
  # verifying; what broke is attribution. Every agent and task pseudonym
  # already in the ledger names something no future run can reproduce, and
  # ADR-0041 makes the secret per-deployment on purpose, which is exactly what
  # makes it unrecoverable.
  innsegl-identity-secret:
    name: ${INNSEGL_TRUST_IDENTITY_SECRET_VOLUME:-${COMPOSE_PROJECT_NAME:-innsegl-core}_innsegl-identity-secret}
    external: ${INNSEGL_TRUST_VOLUMES_EXTERNAL:-false}

  # DECLARED IN spire.yml, JOINED HERE, and the only thing this stack takes
  # from SPIRE besides one network. Compose names a project's volume
  # <project>_<key>, so spire.yml's `spire-agent-socket` is
  # `innsegl-spire_spire-agent-socket`; overridable so an ADR-0022 test overlay
  # can point at a per-process SPIRE stack's socket.
  # MOUNTED BY: spire-agent (rw, in its own project) and innsegl-mcp.
  spire-agent-socket:
    name: ${INNSEGL_SPIRE_AGENT_SOCKET_VOLUME:-innsegl-spire_spire-agent-socket}
    external: true
