# SPDX-License-Identifier: Apache-2.0
#
# SPIRE agent — reference compose stack (doc 05 §1, RM-014 #22).
#
# The agent is the only component that ever attests a workload, so its plugin
# list *is* the attestation policy. Doc 04 "SPIRE deployment": "selector policy
# is code-reviewed config. Weak selectors are the realistic failure — treat
# selector definitions as security-critical review surface." Read the
# WorkloadAttestor block below as that surface.

agent {
    # PROTECTED STRING — same reasoning as the server's. Not parameterised.
    trust_domain = "innsegl.dev"

    server_address = "spire-server"
    server_port    = "8081"

    # Bootstrapped from a file, never trust-on-first-use. bootstrap.sh wrote
    # this: it is the upstream CA certificate that roots the whole trust
    # domain. `insecure_bootstrap` is deliberately absent (its default is
    # false); setting it true would make a spoofed spire-server sufficient to
    # own the agent.
    trust_bundle_path = "/run/spire/pki/trust-bundle.crt"

    data_dir  = "/run/spire/agent-data"
    log_level = "INFO"

    # The Workload API. Doc 05 §1: "Workload API socket volume-shared with
    # demo-agent". The directory is the named volume `spire-agent-socket`;
    # every attested workload — spire-oidc today, demo-agent and the agent
    # runs of E3/E5 later — mounts that volume and nothing else from SPIRE.
    #
    # This socket is intentionally reachable by unprivileged callers: that is
    # the whole design of the Workload API. It is not an authorization
    # boundary. Anyone who can open it gets *whatever identity they attest to*
    # and nothing else, which is why the selectors below carry the weight.
    socket_path = "/run/spire/agent-sockets/api.sock"
}

plugins {
    # See bootstrap.sh. The agent's SPIFFE ID is
    # spiffe://innsegl.dev/spire/agent/x509pop/<sha1 of this certificate>,
    # and every run entry is parented to it.
    NodeAttestor "x509pop" {
        plugin_data {
            private_key_path = "/run/spire/pki/agent.key"
            certificate_path = "/run/spire/pki/agent.crt"
        }
    }

    KeyManager "disk" {
        plugin_data {
            directory = "/run/spire/agent-data"
        }
    }

    # ---------------------------------------------------------------------
    # WORKLOAD ATTESTATION — the security-critical review surface.
    #
    # Two attestors are enabled, and entries are expected to select on BOTH.
    # Each alone has a known bypass; the conjunction is what makes a claim
    # expensive to forge. SPIRE requires a workload to match EVERY selector on
    # an entry, so listing selectors from two attestors is an AND, not an OR.
    #
    #   docker  — answers "which container is this?" from the caller's cgroup,
    #             then reads that container's labels, env and image identity
    #             from the Docker API. Selectors:
    #               docker:image_config_digest:sha256:...  content-addressed
    #                 image identity. The strongest thing this attestor emits:
    #                 it is the digest of the image config, so it does not
    #                 move when a tag moves and does not depend on the
    #                 registry hostname.
    #               docker:label:dev.innsegl.run-id:...    per-run binding.
    #                 IP §1: identity ≡ single run ≡ single purpose. Without a
    #                 per-run selector, every container from the same image
    #                 would answer to every run entry, and "one entry per run"
    #                 would be bookkeeping rather than a control.
    #               docker:label:dev.innsegl.agent-type / task-id
    #                 the remaining components of the SPIFFE ID, so a
    #                 container cannot claim a run it was not started for even
    #                 if it guesses the run-id.
    #               docker:env:...  available and deliberately NOT used for
    #                 identity: env vars are where secrets end up, and a
    #                 selector on an env var invites putting one there.
    #
    #             KNOWN BYPASS, stated because pretending otherwise is how
    #             weak selectors happen: labels are chosen by whoever starts
    #             the container. Anyone with access to the Docker socket can
    #             start a container with any label and any image and will
    #             attest successfully. Docker-socket access is therefore
    #             equivalent to being able to impersonate any run on this
    #             node. That is a node-trust assumption, not a hole this
    #             config can close — doc 05 §2: "SPIRE hosts are the most
    #             restricted machines in the deployment." Nothing else in the
    #             stack mounts that socket at all. Note that the `:ro` on the
    #             agent's mount is NOT a control: a read-only bind of a Unix
    #             socket still permits every Docker API call (measured — POST
    #             /containers/create returns 201 through one). Narrowing it
    #             needs an allowlisting socket proxy; see spire.yml.
    #
    #   unix    — answers "which process is this?" from the peer credentials
    #             of the socket connection. Selectors:
    #               unix:uid / unix:gid   the workload must run as the user it
    #                 was registered as. Registering an agent run as
    #                 unix:uid:0 would be the textbook weak selector — every
    #                 container runs as root by default, so it would select
    #                 nothing. Agent runs are registered non-root.
    #               unix:path / unix:sha256  (from discover_workload_path)
    #                 bind to the exact binary on disk. unix:sha256 is the
    #                 strongest selector available anywhere in this stack: it
    #                 survives an attacker who controls container metadata but
    #                 not the binary. Use it on entries for fixed workloads
    #                 (spire-oidc, innsegl-mcp); agent runs vary by image, so
    #                 they lean on image_config_digest instead.
    #
    #             discover_workload_path requires the agent to read
    #             /proc/<pid>/exe of the caller, which is why the agent runs
    #             as root in the host PID namespace (spire.yml). That is a
    #             real privilege grant, taken knowingly and in exchange for a
    #             selector nobody can spoof from inside their own container.
    # ---------------------------------------------------------------------
    WorkloadAttestor "docker" {
        plugin_data {
            # Explicit rather than defaulted, so the read-only mount in
            # spire.yml and the path the plugin dials cannot drift apart.
            docker_socket_path = "unix:///var/run/docker.sock"
        }
    }

    WorkloadAttestor "unix" {
        plugin_data {
            discover_workload_path = true
            # Hash binaries up to 64 MiB. Doc 04 D: an unbounded hash of an
            # attacker-supplied binary is a denial-of-service vector against
            # the one component whose availability gates every identity.
            workload_size_limit = 67108864
        }
    }
}

health_checks {
    listener_enabled = true
    bind_address     = "0.0.0.0"
    bind_port        = "8080"
    live_path        = "/live"
    ready_path       = "/ready"
}
