# SPDX-License-Identifier: Apache-2.0
#
# SPIRE OIDC discovery provider — reference compose stack (doc 05 §1, RM-014 #22).
#
# Role (doc 01 §1): JWT-SVID → OIDC bridge for Fulcio. Fulcio will not accept a
# JWT it cannot validate, and it validates by fetching this provider's
# discovery document and JWKS. This is the only SPIRE component with a public
# face (doc 05 §3: oidc.innsegl.dev).
#
# Loaded with `-expandEnv`.

log_level = "info"

# Host allowlist. A request whose Host / X-Forwarded-Host is not on this list
# is rejected, which is what stops this provider from being used to serve the
# trust domain's JWKS under someone else's name.
#   oidc.innsegl.dev  the production name (doc 05 §3)
#   localhost / 127.0.0.1  the published compose port, for local verification
#   spire-oidc  the compose service name, for in-network callers
domains = ["oidc.innsegl.dev", "localhost", "127.0.0.1", "spire-oidc"]

# HTTP, on the container network only. All of .dev is HSTS-preloaded (doc 05
# §3), so the production deployment MUST terminate TLS in front of this — a
# reverse proxy on the VPS per doc 05 §3.1, or the provider's own `acme` block.
# `allow_insecure_scheme` is what makes the provider willing to advertise an
# http:// issuer at all, and it is scoped to this compose file: the two
# settings are here together so neither can be enabled without the other being
# visible in review.
insecure_addr         = ":8080"
allow_insecure_scheme = true

# The issuer advertised in the discovery document. Must equal the server's
# `jwt_issuer`; both read INNSEGL_SPIRE_JWT_ISSUER so they cannot drift.
jwt_issuer = "${INNSEGL_SPIRE_JWT_ISSUER}"

# Key material comes from the Workload API, NOT from `server_api`.
#
# That is a deliberate least-privilege choice: `server_api` would require
# mounting spire-server's unauthenticated admin socket into this container, and
# this container is the one with a public listener. Via the Workload API the
# provider is an ordinary attested workload holding an ordinary SVID, it sits
# on no network with spire-server at all, and the worst a compromise of it can
# do is serve the trust bundle's *public* keys — which are public by
# definition. See ADR-0011.
workload_api {
    socket_path  = "/run/spire/agent-sockets/api.sock"
    trust_domain = "innsegl.dev"
}

# /ready and /live on a dedicated localhost listener (port 8008). Localhost
# only, by the provider's design, so the compose healthcheck cannot use it —
# this image is distroless and has no shell or HTTP client to probe with. The
# stack's readiness is probed the way Fulcio will probe it, over HTTP against
# the published port; see spire/README.md.
health_checks {}
