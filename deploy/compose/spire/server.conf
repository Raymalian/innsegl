# SPDX-License-Identifier: Apache-2.0
#
# SPIRE server — reference compose stack (doc 05 §1, RM-014 #22).
#
# Loaded with `-expandEnv`, so ${VAR} below is substituted from the container
# environment set in spire.yml. Nothing security-relevant is parameterised: the
# trust domain and the admin ID are literals on purpose (see below).

server {
    # PROTECTED STRING (doc 01 §1, VERSIONING.md "protected surfaces"). The
    # trust domain is the root of every SPIFFE ID this system ever mints:
    # spiffe://innsegl.dev/agent/{agent-type}/{task-id}/{run-id}. It is not an
    # environment variable, because a deployment that can be pointed at a
    # different trust domain by an env var is a deployment where attribution
    # can be silently re-rooted.
    trust_domain = "innsegl.dev"

    bind_address = "0.0.0.0"
    bind_port    = "8081"

    # The local admin socket. It is UNAUTHENTICATED — anything that can open
    # this file has full server admin, including minting entries anywhere in
    # the trust domain. It therefore lives on a tmpfs private to this
    # container (spire.yml), which no other container can mount. innsegl-mcp
    # does NOT get this socket; it reaches the admin API over TCP,
    # authenticated by SVID, on the innsegl-spire-admin network. See ADR-0011.
    socket_path = "/run/spire/admin/api.sock"

    data_dir  = "/run/spire/server-data"
    log_level = "INFO"

    # Short by design. IP §1: "One SPIRE registration entry per run, short TTL,
    # created at registration, deleted at retirement." These are the defaults;
    # RM-015 (#23) sets a per-entry TTL on each run entry, which is what SPI-003
    # exercises.
    ca_ttl                = "24h"
    default_x509_svid_ttl = "30m"
    default_jwt_svid_ttl  = "5m"

    # The `iss` claim on every JWT-SVID. It must equal the issuer in the OIDC
    # discovery document that spire-oidc serves, or Fulcio's issuer check fails
    # (doc 05 §3: oidc.innsegl.dev, subject to the ADR-0002 open item). Both
    # this and the provider read the same variable so they cannot drift.
    jwt_issuer = "${INNSEGL_SPIRE_JWT_ISSUER}"

    # The MCP is the only component that holds SPIRE admin (doc 01 §1, doc 05
    # §1). An SVID bearing this ID gets admin over the TCP API; nothing else
    # does — not spire-agent, not spire-oidc, not any agent run. The entry that
    # issues this SVID is created by the operator bootstrap (register.sh) and
    # is attested with the MCP's own selectors, so "holding the admin
    # credential" requires *being* the MCP container, not merely reaching it.
    #
    # LIMIT, stated rather than papered over: admin_ids grants FULL admin. It
    # does not scope entry creation to the /agent/ subtree, which is what
    # SPI-005 and threat-model AB-10 require. SPIRE's mechanism for that is the
    # experimental OPA authorization policy engine
    # (server.experimental.auth_opa_policy_engine, keyed on
    # input.full_method == "/spire.api.server.entry.v1.Entry/BatchCreateEntry"
    # and input.req.entries[_].spiffe_id.path). Wiring it is RM-015's (#23),
    # together with the test that proves it; leaving a half-configured
    # experimental authorization policy here would weaken the default one.
    admin_ids = ["spiffe://innsegl.dev/innsegl/mcp"]
}

plugins {
    # SQLite. Doc 05 §1: "SQLite datastore acceptable here only". Production
    # (doc 05 §2) runs SPIRE server HA against a shared Postgres. A single
    # SQLite file cannot be shared by two servers, so this choice is also what
    # pins the compose stack to exactly one server instance.
    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "/run/spire/server-data/datastore.sqlite3"
        }
    }

    # NODE ATTESTATION — see bootstrap.sh for why x509pop and not join_token.
    # The agent proves possession of a private key whose certificate chains to
    # node-ca.crt. Only the CA *certificate* is here; the node CA key is never
    # mounted into any long-lived container.
    NodeAttestor "x509pop" {
        plugin_data {
            ca_bundle_path = "/run/spire/pki/node-ca.crt"
        }
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/run/spire/server-data/keys.json"
        }
    }

    # The trust domain root. Compose keeps it on disk; doc 05 §2 puts it in a
    # KMS/HSM in production (threat model A1: "SPIRE server signing keys /
    # trust domain root. Compromise = mint any agent identity"). Having a
    # known upstream root is also what lets spire-agent bootstrap from a file
    # instead of trusting the server on first contact.
    UpstreamAuthority "disk" {
        plugin_data {
            cert_file_path = "/run/spire/pki/upstream-ca.crt"
            key_file_path  = "/run/spire/pki/upstream-ca.key"
        }
    }
}

# HTTP liveness/readiness. Not published to the host and not on the OIDC
# network — reachable only from the two networks the server sits on. RM-018
# (#26) drives failure injection against these.
health_checks {
    listener_enabled = true
    bind_address     = "0.0.0.0"
    bind_port        = "8080"
    live_path        = "/live"
    ready_path       = "/ready"
}
