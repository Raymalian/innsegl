# SPDX-License-Identifier: Apache-2.0
#
# nginx for the innsegl-dashboard image (RM-076, #109).
#
# The dashboard's router is `history.pushState` with no routing dependency
# (web/src/app/router.tsx), so every path below the root has to be served the
# same index.html and resolved in the browser. Without the `try_files`
# fallback, a reloaded or pasted deep link — which is exactly how an operator
# shares a run — returns 404.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset names come out of vite's build, so they are immutable and
    # can be cached hard. index.html never is: it is the file that names the
    # current hashes, and a cached one pins a browser to a deleted bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The client-side router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------------
    # The BFF. doc 05 §1's innsegl-dashboard row is "Read-only UI + BFF proof
    # checks"; this image is the UI and `innsegl api` (deploy/compose's
    # innsegl-api service) is the BFF.
    #
    # WHY A PROXY AND NOT A SECOND ORIGIN. web/ fetches these paths RELATIVE —
    # web/src/views/overview/data.ts's DEFAULT_API_BASE is the string
    # "/api/v1" — so the browser sends them to whatever origin served the page.
    # internal/api sets no CORS headers anywhere, deliberately, so a second
    # origin would need one invented for it. Same-origin through this block is
    # the arrangement that needs nothing new.
    #
    # WHY THE UPSTREAM IS A VARIABLE. With a literal hostname in proxy_pass,
    # nginx resolves it ONCE AT START-UP and refuses to start if it does not
    # resolve — so a dashboard container that came up before innsegl-api, or an
    # image run outside this compose project, would exit with "host not found in
    # upstream" rather than serve the UI. A variable defers the lookup to the
    # request, which turns that into a 502 on the API routes while the UI, and
    # its own load-failure state (doc 06 §4.6), still render. That visible
    # failure is the outcome #109 argued for.
    #
    # `resolver` is Docker's embedded DNS. It is required: without one, nginx
    # cannot resolve a variable upstream at all.
    #
    # proxy_pass carries NO URI component, so the original request URI is
    # passed through unchanged — /api/v1/runs?repo=... reaches the BFF as it
    # was sent.
    #
    # NO AUTHENTICATION IS ADDED HERE, and none is stripped. `innsegl api`
    # authenticates nobody; doc 05 §3 puts dashboard.innsegl.dev behind
    # Cloudflare Access and RM-062 (#70) is the issue that does it. A proxy that
    # invented an auth scheme at this layer would be a second thing to review
    # and a second thing for a deployment to believe it had.
    # ------------------------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $innsegl_api "innsegl-api:8082";

    location /api/v1/ {
        proxy_pass http://$innsegl_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A proof request runs live checks against Fulcio and Rekor;
        # `innsegl api`'s own -upstream-timeout bounds each one at 15s, so this
        # has to outlast it or the proxy would report a failure the BFF was
        # about to answer.
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # internal/api already sets Cache-Control: no-store on every response
        # (server.go, so that "a proof is a live check" cannot be served from an
        # intermediary's cache). Nothing here may add one back.
        proxy_buffering off;
        # MEASURED: without this the response carried `X-Content-Type-Options:
        # nosniff` TWICE — internal/api sets it on every response and this
        # server's `add_header` is inherited into this location, which appends
        # rather than replaces. The values are identical, so it is cosmetic, but
        # a duplicated security header is the kind of thing a reviewer stops on.
        # The server-level one below is the survivor, so every response from
        # this origin carries exactly one, from one place.
        proxy_hide_header X-Content-Type-Options;
    }

    # doc 05 §3: the dashboard is operational tooling and may sit behind
    # VPN/SSO; the public proof surface is verify. These three headers cost
    # nothing and a reverse proxy that forgets them is one deployment away.
    #
    # No Content-Security-Policy is set here, deliberately: index.html carries
    # a blocking inline script (the theme bootstrap, asserted identical to
    # web/src/app/theme.ts by FE-018), so any honest policy would need either
    # 'unsafe-inline' — which is not a policy — or a nonce this static server
    # cannot mint. A CSP belongs at the TLS terminator that serves
    # dashboard.innsegl.dev, together with the nonce; that is E8's, and it is
    # named here rather than faked with a header that permits everything.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
}
