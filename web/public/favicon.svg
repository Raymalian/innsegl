<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Innsegl">
  <title>Innsegl</title>
  <!-- SPDX-License-Identifier: Apache-2.0

       The mark, weighted for a browser tab. The rim and the rune are heavier than
       innsegl-mark.svg because at 16px the reading-size strokes disappear; an SVG
       favicon scales ONE drawing, so the weights have to suit the smallest use.

       The wax is #167a49 — the same --innsegl-palette-verification-600 the
       dashboard uses for a passing verdict. Red is deliberately absent: in
       this palette red means FAILED, and a mark carrying it would say so
       every time it sat beside a verdict.

       Three parts: the wax, squeezed out unevenly; the rim the die pressed
       into it; and the bind-rune, one stave carrying two arms. -->
